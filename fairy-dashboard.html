function toArabicDigits(str){
  const map = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
  return String(str).replace(/[0-9]/g, d=>map[d]);
}

function pickQuote(){ return QUOTES[Math.floor(Math.random()*QUOTES.length)]; }

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function timeAgo(iso){
  if(!iso) return "—";
  const d = new Date(iso), now = new Date();
  const mins = Math.floor((now-d)/60000);
  if(mins<60) return mins+"m ago";
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+"h ago";
  const days = Math.floor(hrs/24);
  if(days<30) return days+"d ago";
  return d.toLocaleDateString();
}

}

      </div>
      {showPwForm && (
        <div style={{marginTop:8,display:"flex",gap:8,alignItems:"flex-start"}}>
          <input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)} placeholder={t.newPw} style={{flex:1,minWidth:0,padding:10,border:"1px solid #ddd",borderRadius:10,fontSize:13,boxSizing:"border-box"}}/>
          <button onClick={changePassword} disabled={pwSaving} style={{flexShrink:0,background:DK,color:"#fff",border:"none",borderRadius:10,padding:"10px 14px",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>{pwSaving?t.saving:t.update}</button>
        </div>
      )}
      {pwMsg && <div style={{textAlign:"right",fontSize:11.5,marginTop:4,color:pwMsg.includes("updated")?DK:"#DC2626"}}>{pwMsg}</div>}

      <h1 className="spartan" style={{fontSize:26,color:DK,marginTop:12,display:"flex",alignItems:"center",gap:8}}><Sparkle size={22} color={DK}/> {isAr?"جنيات الثلاجة":"Fridge Fairies"}</h1>
      <div style={{marginTop:10}}>
        <div style={{fontWeight:700,fontSize:15,color:DK}}>{t.welcomeBack(profile?.username || profile?.first_name || (isAr?"صديق":"friend"))}</div>
        <div style={{fontSize:12.5,color:MT,marginTop:4,fontStyle:"italic",lineHeight:1.5}}>{quote}</div>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:12,marginTop:18,background:"#fff",border:"1px solid #eee",borderRadius:14,padding:14}}>
        <label style={{position:"relative",cursor:"pointer",flexShrink:0}}>
          <div style={{width:52,height:52,borderRadius:"50%",overflow:"hidden",background:"#F3F4F6",display:"flex",alignItems:"center",justifyContent:"center",border:`2px solid ${DK}`}}>
            {profile?.photo_url ? <img src={profile.photo_url} style={{width:"100%",height:"100%",objectFit:"cover"}}/> : <Sparkle size={20} color={DK}/>}
          </div>
          <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>uploadPhoto(e.target.files[0])}/>
          <div style={{position:"absolute",bottom:-2,right:-2,background:DK,color:"#fff",borderRadius:"50%",width:18,height:18,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center"}}>✎</div>
        </label>
        <div style={{flex:1,minWidth:0}}>
          {editingUsername ? (
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <input value={username} onChange={e=>setUsername(e.target.value)} placeholder={isAr?"اختر اسم مستخدم":"Choose a username"} style={{flex:1,minWidth:0,height:38,padding:"0 12px",border:"1px solid #E5E7EB",borderRadius:19,fontSize:13,boxSizing:"border-box"}}/>
              <button onClick={saveUsername} style={{flexShrink:0,height:38,background:DK,color:"#fff",border:"none",borderRadius:19,padding:"0 18px",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>{t.save}</button>
            </div>
          ) : (
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontWeight:700,fontSize:15,color:DK}}>{username}</span>
              <a onClick={()=>setEditingUsername(true)} style={{fontSize:11.5,color:MT,cursor:"pointer",textDecoration:"underline"}}>{t.edit}</a>
            </div>
          )}
          <div style={{display:"flex",gap:14,marginTop:6,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"#374151"}}><b style={{color:DK}}>{isAr?toArabicDigits(myStats.refills):myStats.refills}</b> {t.refills}</span>
            <span style={{fontSize:12,color:"#374151"}}><b style={{color:DK}}>{isAr?toArabicDigits(myStats.cleanings):myStats.cleanings}</b> {t.cleanedLbl}</span>
            {profile?.created_at && <span style={{fontSize:12,color:MT}}>{t.since(new Date(profile.created_at).toLocaleDateString(isAr?"ar":undefined,{month:"short",year:"numeric"}))}</span>}
          </div>
          <div style={{fontSize:11,color:usernameMsg==="Saved ✓"?DK:"#DC2626",marginTop:4,minHeight:14}}>{usernameMsg}{photoUploading?"Uploading photo…":""}</div>
        </div>
      </div>

      <h2 style={{fontSize:14,textTransform:"uppercase",letterSpacing:0.4,color:MT,marginTop:28}}>{t.myActivity}</h2>
      {myActivity.length===0 ? (
        <div style={{color:MT,fontSize:13,marginTop:8}}>{t.nothingLogged}</div>
      ) : (
        <div style={{marginTop:10,display:"flex",flexDirection:"column"}}>
          {myActivity.map((a,i)=>(
            <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom: i<myActivity.length-1 ? "1px solid #F0F0F0" : "none"}}>
              <span style={{width:6,height:6,borderRadius:"50%",background: a.activity_type==='cleaning' ? "#22C55E" : DK, flexShrink:0}}></span>
              <div style={{flex:1,minWidth:0}}>
                <span style={{fontSize:13,color:"#374151"}}>{isAr && a.fridges?.name_ar ? a.fridges.name_ar : a.fridges?.name_en} · {a.fridges?.code} — {a.activity_type==='cleaning'?t.cleaned:t.refilled}</span>
                {a.notes && <div style={{fontSize:11,color:MT,marginTop:2}}>{a.notes}</div>}
              </div>
              <span style={{fontSize:11.5,color:MT,flexShrink:0}}>{timeAgo(a.created_at)}</span>
            </div>
          ))}
        </div>
      )}

      <h2 style={{fontSize:14,textTransform:"uppercase",letterSpacing:0.4,color:MT,marginTop:28}}>{t.wishlistNear(isAr?toArabicDigits(wishlist.length):wishlist.length)}</h2>
      <div style={{color:MT,fontSize:11.5,marginTop:2,marginBottom:8}}>{t.fromRegistered}</div>
      <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,cursor:"pointer"}}>
        <input type="checkbox" checked={notifyEmail} onChange={toggleNotifyEmail}/>
        <span style={{fontSize:12,color:"#374151"}}>{t.emailMe}</span>
      </label>
      {loading ? <div style={{color:MT,marginTop:10}}>{t.loading}</div> : wishlist.length===0 ? (
        <div style={{color:MT,fontSize:13,marginTop:10}}>{t.nothingYetWishlist}</div>
      ) : (
        <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
          {wishlist.map(w=>{
            const wFridge = w._fridge_id ? fridges.find(f=>f.id===w._fridge_id) : null;
            const wHasCoords = wFridge && wFridge.lat!=null && wFridge.lng!=null;
            const wDistKm = (wHasCoords && myLocation) ? haversineKm(myLocation.lat, myLocation.lng, wFridge.lat, wFridge.lng) : null;
            const wDirectionsUrl = wHasCoords ? `https://www.google.com/maps/dir/?api=1&destination=${wFridge.lat},${wFridge.lng}&travelmode=driving` : null;
            return (
            <div key={w.id} style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:12,padding:12}}>
              <div style={{fontWeight:700,fontSize:14}}>{w.item}</div>
              <div style={{color:MT,fontSize:12,marginTop:3}}>{isAr?"منطقة":"Zone"} {w.food_box_applications?.zone} · {w.food_box_applications?.whatsapp||(isAr?"لا يوجد رقم هاتف":"no phone on file")}</div>
              {wFridge && (
                <div style={{fontSize:12,color:MT,marginTop:2}}>
                  📍 {isAr && wFridge.name_ar ? wFridge.name_ar : wFridge.name_en}
                  {wDistKm!=null ? ` · ${t.kmAway(isAr?toArabicDigits(wDistKm.toFixed(1)):wDistKm.toFixed(1))}` : ""}
                </div>
              )}
              {wDirectionsUrl && (
                <a href={wDirectionsUrl} target="_blank" rel="noreferrer" style={{display:"inline-block",marginTop:6,fontSize:12,fontWeight:700,color:DK,textDecoration:"none"}}>🧭 {t.getDirections} →</a>
              )}
            </div>
          )})}
        </div>
      )}

      <h2 style={{fontSize:14,textTransform:"uppercase",letterSpacing:0.4,color:MT,marginTop:32}}>{t.myLocalFridges(isAr?toArabicDigits(myFridges.length):myFridges.length)}</h2>
      {myFridges.length===0 ? (
        <div style={{color:MT,fontSize:13,marginTop:8}}>{t.noneYet}</div>
      ) : (
        <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
          {myFridges.map(f=>(
            <div key={f.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600}}>{isAr && f.name_ar ? f.name_ar : f.name_en} <span style={{color:MT,fontWeight:400}}>· {f.code}</span></div>
                <div style={{fontSize:11,color:MT}}>{isAr && f.zone_name_ar ? f.zone_name_ar : f.zone_name}</div>
              </div>
              <button onClick={()=>toggleLocal(f.id)} style={{flexShrink:0,border:"none",background:"transparent",color:"#DC2626",fontSize:16,cursor:"pointer",padding:"4px 6px"}}>✕</button>
            </div>
          ))}
        </div>
      )}

      <div style={{marginTop:16,position:"relative"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={t.typeToAdd} style={{width:"100%",padding:"12px 14px",border:"1px solid #ddd",borderRadius:10,fontSize:13.5}}/>
        {filtered.length>0 && (
          <div style={{marginTop:6,border:"1px solid #eee",borderRadius:10,overflow:"hidden"}}>
            {filtered.map(f=>(
              <div key={f.id} onClick={()=>{toggleLocal(f.id); setSearch("");}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"#fff",borderBottom:"1px solid #f3f3f3",cursor:"pointer"}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600}}>{isAr && f.name_ar ? f.name_ar : f.name_en} <span style={{color:MT,fontWeight:400}}>· {f.code}</span></div>
                  <div style={{fontSize:11,color:MT}}>{isAr && f.zone_name_ar ? f.zone_name_ar : f.zone_name}</div>
                </div>
                <span style={{color:DK,fontWeight:700,fontSize:12}}>{t.add}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <h2 style={{fontSize:14,textTransform:"uppercase",letterSpacing:0.4,color:MT,marginTop:36}}>{t.planRoute}</h2>
      <div style={{color:MT,fontSize:12,marginTop:2,marginBottom:10}}>{t.searchAny}</div>

      {(() => {
        const stops = fridges.filter(f=>routeIds.has(f.id));
        const routeSearchResults = routeSearch ? fridges.filter(f =>
          !routeIds.has(f.id) && (
            f.name_en.toLowerCase().includes(routeSearch.toLowerCase()) ||
            f.zone_name.toLowerCase().includes(routeSearch.toLowerCase()) ||
            f.code.toLowerCase().includes(routeSearch.toLowerCase())
          )
        ).slice(0,8) : [];

        function addToRoute(id){ const n=new Set(routeIds); n.add(id); setRouteIds(n); }
        function removeFromRoute(id){ const n=new Set(routeIds); n.delete(id); setRouteIds(n); }

        function surpriseMe(){
          const perStop = surpriseDuration==="30" ? 12 : surpriseDuration==="60" ? 8 : 6; // rough minutes/stop incl. driving
          const maxByDuration = Math.max(2, Math.round(parseInt(surpriseDuration,10)/perStop));
          const n = Math.min(surpriseCount, maxByDuration);
          const candidates = fridges
            .filter(f=>f.status==='active' && f.lat && f.lng)
            .sort((a,b)=>{
              const at=a.last_refill_at?new Date(a.last_refill_at).getTime():0;
              const bt=b.last_refill_at?new Date(b.last_refill_at).getTime():0;
              return at-bt;
            })
            .slice(0,n);
          setRouteIds(new Set(candidates.map(f=>f.id)));
        }

        return (
          <div>
            {stops.length>0 && (
              <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
                {stops.map(f=>(
                  <div key={f.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600}}>{isAr && f.name_ar ? f.name_ar : f.name_en} <span style={{color:MT,fontWeight:400}}>· {f.code}</span></div>
                      <div style={{fontSize:11,color:MT}}>{isAr && f.zone_name_ar ? f.zone_name_ar : f.zone_name}</div>
                    </div>
                    <button onClick={()=>removeFromRoute(f.id)} style={{flexShrink:0,border:"none",background:"transparent",color:"#DC2626",fontSize:16,cursor:"pointer",padding:"4px 6px"}}>✕</button>
                  </div>
                ))}
              </div>
            )}

            <div style={{position:"relative"}}>
              <input value={routeSearch} onChange={e=>setRouteSearch(e.target.value)} placeholder={t.typeToAdd} style={{width:"100%",padding:"12px 14px",border:"1px solid #ddd",borderRadius:10,fontSize:13.5}}/>
              {routeSearchResults.length>0 && (
                <div style={{marginTop:6,border:"1px solid #eee",borderRadius:10,overflow:"hidden"}}>
                  {routeSearchResults.map(f=>(
                    <div key={f.id} onClick={()=>{addToRoute(f.id); setRouteSearch("");}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"#fff",borderBottom:"1px solid #f3f3f3",cursor:"pointer"}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:600}}>{isAr && f.name_ar ? f.name_ar : f.name_en} <span style={{color:MT,fontWeight:400}}>· {f.code}</span></div>
                        <div style={{fontSize:11,color:MT}}>{isAr && f.zone_name_ar ? f.zone_name_ar : f.zone_name}</div>
                      </div>
                      <span style={{color:DK,fontWeight:700,fontSize:12}}>{t.add}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{marginTop:20,background:"#FEF9EC",border:"1px solid #FDE9B8",borderRadius:14,padding:16}}>
              <div style={{fontWeight:700,fontSize:14,color:"#92600C"}}>{t.surpriseMe}</div>
              <div style={{fontSize:11.5,color:"#92600C",marginTop:3,lineHeight:1.5}}>{t.surpriseDesc}</div>
              <div style={{display:"flex",gap:10,marginTop:12}}>
                <div style={{flex:1}}>
                  <label style={{fontSize:11,fontWeight:700,color:"#92600C"}}>{t.numFridges}</label>
                  <select value={surpriseCount} onChange={e=>setSurpriseCount(parseInt(e.target.value,10))} style={{width:"100%",marginTop:4,padding:"9px 10px",borderRadius:8,border:"1px solid #FDE9B8",fontSize:13}}>
                    {[2,3,4,5,6,8,10].map(n=><option key={n} value={n}>{isAr?toArabicDigits(n):n} {t.fridges}</option>)}
                  </select>
                </div>
                <div style={{flex:1}}>
                  <label style={{fontSize:11,fontWeight:700,color:"#92600C"}}>{t.journeyLen}</label>
                  <select value={surpriseDuration} onChange={e=>setSurpriseDuration(e.target.value)} style={{width:"100%",marginTop:4,padding:"9px 10px",borderRadius:8,border:"1px solid #FDE9B8",fontSize:13}}>
                    <option value="30">{t.min30}</option>
                    <option value="60">{t.hr1}</option>
                    <option value="120">{t.hr2}</option>
                  </select>
                </div>
              </div>
              <button onClick={surpriseMe} style={{width:"100%",marginTop:12,background:"#D97706",color:"#fff",border:"none",borderRadius:10,padding:11,fontWeight:700,fontSize:13,cursor:"pointer"}}>{t.surpriseMe}</button>
              <div style={{fontSize:10.5,color:"#92600C",marginTop:6,opacity:0.8}}>{t.surpriseNote}</div>
            </div>

            {stops.length>0 && (() => {
              const withCoords = stops.filter(f=>f.lat && f.lng);
              if(withCoords.length===0) return null;
              const dest = withCoords[withCoords.length-1];
              const waypoints = withCoords.slice(0,-1).map(f=>`${f.lat},${f.lng}`).join("|");
              const routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${dest.lat},${dest.lng}${waypoints?`&waypoints=${waypoints}`:""}&travelmode=driving`;
              return (
                <div style={{position:"sticky",bottom:16,marginTop:20,background:"#fff",border:`2px solid ${DK}`,borderRadius:14,padding:14,boxShadow:"0 4px 14px rgba(0,0,0,0.12)"}}>
                  <div style={{fontSize:12.5,fontWeight:700,color:DK}}>{t.routeStops(isAr?toArabicDigits(withCoords.length):withCoords.length)}</div>
                  <div style={{fontSize:11,color:MT,marginTop:2}}>{t.routeStart}</div>
                  <a href={routeUrl} target="_blank" rel="noreferrer" style={{display:"block",textAlign:"center",marginTop:10,background:DK,color:"#fff",padding:"10px",borderRadius:10,fontWeight:700,fontSize:13,textDecoration:"none"}}>{t.openRoute}</a>
                </div>
              );
            })()}
          </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
