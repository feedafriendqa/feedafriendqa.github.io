function toArabicDigits(str){
  const map = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
  return String(str).replace(/[0-9]/g, d=>map[d]);
}

function timeAgo(iso, isAr){
  if(!iso) return "—";
  const d = new Date(iso), now = new Date();
  const mins = Math.floor((now-d)/60000);
  let out;
  if(mins<60) out = mins+(isAr?" د":"m ago");
  else {
    const hrs = Math.floor(mins/60);
    if(hrs<24) out = hrs+(isAr?" س":"h ago");
    else {
      const days = Math.floor(hrs/24);
      if(days<30) out = days+(isAr?" ي":"d ago");
      else return d.toLocaleDateString();
    }
  }
  return isAr ? toArabicDigits(out) : out;
}

function haversineKm(lat1,lng1,lat2,lng2){
  if([lat1,lng1,lat2,lng2].some(v=>v==null||isNaN(v))) return null;
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function App(){

    setLoading(true);

      sb.from("fridges").select("*").order("zone_name"),
      sb.from("fridge_activity").select("*, fridges(code,name_en,zone_name,photo_url)").in("activity_type",["refill","cleaning"]).order("created_at",{ascending:false}).limit(8),
      sb.from("fridge_activity").select("id",{count:"exact",head:true}).eq("activity_type","refill"),
      sb.from("site_stats").select("legacy_refill_count").eq("id",1).single()
    ]);
    setFridges(fr||[]);
    setActivity(act||[]);
    setRefillTotal((liveRefills||0) + (stats?.legacy_refill_count||0));
    const zmap = {};
    (fr||[]).forEach(f=>{ zmap[f.zone_name]=(zmap[f.zone_name]||0)+1; });
    setZones(Object.entries(zmap).sort((a,b)=>b[1]-a[1]));
    setLoading(false);
  }

  function detect(){
    setLocStatus("locating");
    setSelectedZone("");
    if(!navigator.geolocation){ setLocStatus("error"); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{ setUserLoc({lat:pos.coords.latitude,lng:pos.coords.longitude}); setLocStatus("done"); },
      ()=>setLocStatus("error"),
      {timeout:8000}
    );
  }

  const withDist = fridges.map(f=>({...f, _dist: userLoc ? haversineKm(userLoc.lat,userLoc.lng,f.lat,f.lng) : null}));

  let results = [];
  if(userLoc){
    results = withDist.filter(f=>f.status!=='closed').sort((a,b)=>(a._dist??1e9)-(b._dist??1e9)).slice(0,5);
  } else if(selectedZone){
    results = withDist.filter(f=>f.zone_name===selectedZone && f.status!=='closed').slice(0,5);
  }

  const needy = [...fridges].filter(f=>f.status==='active').sort((a,b)=>{
    const at=a.last_refill_at?new Date(a.last_refill_at).getTime():0;
    const bt=b.last_refill_at?new Date(b.last_refill_at).getTime():0;
    return at-bt;
  }).slice(0,8);

  const visibleZones = showAllZones ? zones : zones.slice(0,5);

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <img src={LOGO} style={{height:32}}/>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <button onClick={()=>setLang(isAr?"en":"ar")} style={{border:`1.5px solid ${DK}`,color:DK,background:"#fff",borderRadius:16,padding:"5px 12px",fontSize:12.5,fontWeight:700,cursor:"pointer",fontFamily:isAr?BF:BF}}>{isAr?"English":"عربي"}</button>
          <a href="index.html" style={{fontSize:14,color:DK,textDecoration:"none",fontWeight:700,display:"flex",alignItems:"center",gap:6}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 11l9-8 9 8" stroke={DK} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" stroke={DK} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            {t.home}
          </a>
        </div>
      </div>

      <div style={{display:"flex",gap:16,alignItems:"flex-start",marginTop:32}}>
        <img src={HERO_PHOTO} style={{width:"42%",height:210,objectFit:"cover",borderRadius:20,flexShrink:0}}/>
        <div style={{width:"58%",minWidth:0}}>
          <h1 className="spartan" style={{fontSize:"clamp(18px,6.2vw,32px)",lineHeight:1.1,color:DK,whiteSpace:isAr?"normal":"nowrap"}}>{t.findMy}</h1>
          <div style={{color:"#1F2937",fontWeight:700,fontSize:14,marginTop:10,fontFamily:BF}}>{t.tagline}</div>
          <button onClick={detect} style={{width:"100%",marginTop:18,background:DK,color:"#fff",border:"none",borderRadius:24,padding:"11px 10px",fontWeight:700,fontSize:12.5,fontFamily:BF,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,whiteSpace:"nowrap"}}>
            📍 {locStatus==="locating"?t.locating:locStatus==="done"?t.located:t.detect}
          </button>
          <div style={{textAlign:"center",color:MT2,fontSize:12,margin:"12px 0"}}>{t.or}</div>
          <select value={selectedZone} onChange={e=>{setSelectedZone(e.target.value); setUserLoc(null); setLocStatus("idle");}} style={{width:"100%",border:`1.5px solid ${DK}`,color:DK,borderRadius:24,padding:"11px 16px",fontWeight:700,fontSize:13,fontFamily:BF,textAlign:"center",background:"#fff",cursor:"pointer"}}>
            <option value="">{t.selectLoc}</option>
            {zones.map(([name,count])=><option key={name} value={name}>{name} ({isAr?toArabicDigits(count):count})</option>)}
          </select>
          {locStatus==="error" && <div style={{color:"#B5591A",fontSize:11.5,marginTop:8}}>{t.locError}</div>}
        </div>
      </div>

      {results.length > 0 && (
        <div style={{marginTop:24}}>
          <div style={{fontSize:12,letterSpacing:0.4,textTransform:"uppercase",color:MT,fontWeight:700,fontFamily:BF}}>
            {userLoc ? t.nearbyTitle : t.zoneTitle(selectedZone)}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:12}}>
            {results.map(f=>{
              const mapUrl = f.map_link || (f.lat && f.lng ? `https://www.google.com/maps?q=${f.lat},${f.lng}` : null);
              return (
                <div key={f.id} style={{display:"flex",gap:12,background:"#fff",border:"1px solid #eee",borderRadius:14,padding:12}}>
                  <img src={f.photo_url||PLACEHOLDER} onError={e=>e.target.src=PLACEHOLDER} style={{width:56,height:56,borderRadius:10,objectFit:"cover",flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13.5,color:"#111"}}>{isAr && f.name_ar ? f.name_ar : f.name_en} <span style={{color:MT2,fontWeight:500}}>· {f.code}</span></div>
                    <div style={{fontSize:11.5,color:MT,marginTop:2}}>{f.zone_name}{f._dist!=null?` · ${t.kmAway(f._dist)}`:""}</div>
                    <div style={{display:"flex",gap:8,marginTop:8}}>
                      {mapUrl && <a href={mapUrl} target="_blank" rel="noreferrer" style={{fontSize:11.5,fontWeight:700,color:DK,border:`1.3px solid ${DK}`,borderRadius:8,padding:"5px 10px",textDecoration:"none"}}>📍 {t.getDirections}</a>}
                      <a href={`fridge-log.html?fridge=${f.code}`} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:11.5,fontWeight:700,color:"#fff",background:DK,borderRadius:8,padding:"5px 10px",textDecoration:"none"}}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 10Z" stroke="#fff" strokeWidth="2"/></svg>
                        {t.refillBtn}
                      </a>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      <div style={{display:"flex",background:DK,borderRadius:12,marginTop:20,overflow:"hidden"}}>
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"9px 6px"}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="2" stroke="#fff" strokeWidth="1.8"/><line x1="5" y1="9" x2="19" y2="9" stroke="#fff" strokeWidth="1.8"/></svg>
          <span className="spartan" style={{color:"#fff",fontSize:16}}>{isAr?toArabicDigits(fridges.length||101):(fridges.length||101)}</span>
          <span style={{color:"#BBF7D0",fontSize:11.5,fontWeight:600}}>{t.fridgesLbl}</span>
        </div>
        <div style={{width:1,background:"rgba(255,255,255,0.25)",margin:"8px 0"}}></div>
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"9px 6px"}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 10Z" stroke="#fff" strokeWidth="1.8"/></svg>
          <span className="spartan" style={{color:"#fff",fontSize:16}}>{refillTotal!=null ? (isAr?toArabicDigits(refillTotal.toLocaleString()):refillTotal.toLocaleString()) : "…"}</span>
          <span style={{color:"#BBF7D0",fontSize:11.5,fontWeight:600}}>{t.refillsLbl}</span>
        </div>
      </div>

      <hr style={{border:"none",borderTop:"1px solid #E5E7EB",margin:"22px 0 20px"}}/>

      <div>
        <div style={{fontSize:12,letterSpacing:0.4,textTransform:"uppercase",color:MT,fontWeight:700,fontFamily:BF}}>{t.recent}</div>
        <div style={{color:MT2,fontSize:12,marginTop:4,marginBottom:16}}>{t.recentSub}</div>
        <div style={{display:"flex",gap:16,overflowX:"auto",paddingBottom:8,margin:"0 -24px",padding:"0 24px 8px"}}>
          {loading ? [1,2,3].map(i=><div key={i} style={{flexShrink:0,width:140,height:150,background:"#F3F3F3",borderRadius:16}}/>) :
            activity.length===0 ? <div style={{color:MT2,fontSize:14}}>{t.noActivity}</div> :
            activity.map(a=>(
            <div key={a.id} style={{flexShrink:0,width:140}}>
              <div style={{width:140,height:100,borderRadius:16,overflow:"hidden",background:"#F0FDF4",display:"flex",alignItems:"center",justifyContent:"center"}}>
                {a.photo_url ? (
                  <img src={a.photo_url} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
                ) : (
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2" stroke={DK} strokeWidth="1.6"/><path d="M8 7l1.5-2.5h5L16 7" stroke={DK} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><circle cx="12" cy="13.5" r="3.2" stroke={DK} strokeWidth="1.6"/></svg>
                )}
              </div>
              <div style={{fontWeight:600,fontSize:12,marginTop:8,color:"#374151",fontFamily:BF}}>{isAr && a.fridges?.name_ar ? a.fridges.name_ar : a.fridges?.name_en}</div>
              <div style={{fontSize:10.5,color:MT2,marginTop:2}}>{a.fridges?.code} · {a.activity_type==='cleaning'?t.cleaned:t.refilled}</div>
              <div style={{fontSize:10.5,fontWeight:700,color:DK,marginTop:2}}>{timeAgo(a.created_at, isAr)}</div>
            </div>
          ))}
        </div>
      </div>

      <hr style={{border:"none",borderTop:"1px solid #E5E7EB",margin:"44px 0 20px"}}/>

      <div>
        <div style={{fontSize:12,letterSpacing:0.4,textTransform:"uppercase",color:MT,fontWeight:700,fontFamily:BF}}>{t.needsYou}</div>
        <div style={{color:MT2,fontSize:12,marginTop:4,marginBottom:16}}>{t.needsSub}</div>
        <div style={{display:"flex",gap:16,overflowX:"auto",paddingBottom:8,margin:"0 -24px",padding:"0 24px 8px"}}>
          {loading ? [1,2,3,4].map(i=><div key={i} style={{flexShrink:0,width:148,height:180,background:"#F3F3F3",borderRadius:16}}/>) :
            needy.map((f,i)=>(
            <div key={f.id} style={{flexShrink:0,width:148}}>
              <div style={{position:"relative",width:148,height:110,borderRadius:16,overflow:"hidden",background:"#F3F3F3"}}>
                <span style={{position:"absolute",top:8,left:8,width:24,height:24,borderRadius:"50%",background:DK,color:"#fff",fontFamily:DF,fontWeight:900,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.25)",zIndex:2}}>{isAr?toArabicDigits(i+1):i+1}</span>
                <img src={f.photo_url||PLACEHOLDER} onError={e=>e.target.src=PLACEHOLDER} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
              </div>
              <div style={{fontWeight:600,fontSize:12.5,marginTop:9,color:"#374151",fontFamily:BF}}>{isAr && f.name_ar ? f.name_ar : f.name_en}</div>
              <div style={{fontSize:11,color:MT2,marginTop:2}}>{f.code} · {f.zone_name}</div>
              <div style={{fontSize:11,fontWeight:700,color:DK,marginTop:4}}>{timeAgo(f.last_refill_at, isAr)}</div>
            </div>
          ))}
        </div>
      </div>

      <hr style={{border:"none",borderTop:"1px solid #E5E7EB",margin:"44px 0 20px"}}/>

      <div>
        <div style={{fontSize:12,letterSpacing:0.4,textTransform:"uppercase",color:MT,fontWeight:700,fontFamily:BF}}>{t.explore}</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:16}}>
          {visibleZones.map(([name,count])=>(
            <button key={name} onClick={()=>setSelectedZone(name)} style={{
              border:`1.5px solid ${DK}`,borderRadius:20,padding:"7px 14px",fontSize:12.5,fontWeight:600,fontFamily:BF,cursor:"pointer",
              background: selectedZone===name ? DK : "#fff", color: selectedZone===name ? "#fff" : DK
            }}>{name}</button>
          ))}
          {!showAllZones && zones.length>5 && (
            <button onClick={()=>setShowAllZones(true)} style={{border:`2px solid ${DK}`,color:DK,background:"#fff",borderRadius:24,padding:"9px 18px",fontSize:13.5,fontWeight:600,fontFamily:BF,cursor:"pointer"}}>{t.more}</button>
          )}
        </div>
      </div>

      <a href="fridge-log.html" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,textAlign:"center",background:DK,color:"#fff",borderRadius:24,padding:"13px 16px",fontWeight:700,fontSize:14,fontFamily:BF,textDecoration:"none",marginTop:36}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 10Z" stroke="#fff" strokeWidth="2"/></svg>
        {t.logCta}
      </a>

      <div style={{textAlign:"center",color:MT,fontSize:12.5,marginTop:22}}>{t.footer}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
