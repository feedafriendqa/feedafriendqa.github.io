<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Find a Fridge — Feed a Friend</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:#fff;color:#15803D}.spartan{font-family:'League Spartan',sans-serif;font-weight:900}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const sb = supabase.createClient(
  "https://xbxagukdvgyaoqvbqoic.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhieGFndWtkdmd5YW9xdmJxb2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDExNDAsImV4cCI6MjA5NTYxNzE0MH0.-NifUdfkr9cZIDDtKNl5aQe9WMZab7l4boAJDAgfb-4"
);
const PLACEHOLDER = "https://www.fafconnect.org/fridges_photos/fridge_6a339c37a04f16.16713712_WhatsApp_Image_2026-04-05_at_4.36.51_PM.jpeg";
const DK = "#15803D", MT = "#6B7280", MT2 = "#9CA3AF", BF = "Poppins,sans-serif", DF = "'League Spartan',sans-serif";

function timeAgo(iso){
  if(!iso) return "—";
  const d = new Date(iso), now = new Date();
  const mins = Math.floor((now-d)/60000);
  if(mins<60) return mins+"m ago";
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+"h ago";
  const days = Math.floor(hrs/24);
  if(days<30) return days+"d ago";
  return d.toLocaleDateString();
}

function App(){
  const [fridges,setFridges]=React.useState([]);
  const [activity,setActivity]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [zones,setZones]=React.useState([]);
  const [selectedZone,setSelectedZone]=React.useState("");
  const [locStatus,setLocStatus]=React.useState("idle");
  const [showAllZones,setShowAllZones]=React.useState(false);

  React.useEffect(()=>{ load(); },[]);

  async function load(){
    setLoading(true);
    const [{data:fr},{data:act}] = await Promise.all([
      sb.from("fridges").select("*").order("zone_name"),
      sb.from("fridge_activity").select("*, fridges(code,name_en,zone_name)").in("activity_type",["refill","cleaning"]).order("created_at",{ascending:false}).limit(6)
    ]);
    setFridges(fr||[]);
    setActivity(act||[]);
    const zmap = {};
    (fr||[]).forEach(f=>{ zmap[f.zone_name]=(zmap[f.zone_name]||0)+1; });
    setZones(Object.entries(zmap).sort((a,b)=>b[1]-a[1]));
    setLoading(false);
  }

  function detect(){
    setLocStatus("locating");
    if(!navigator.geolocation){ setLocStatus("error"); return; }
    navigator.geolocation.getCurrentPosition(()=>setLocStatus("done"), ()=>setLocStatus("error"), {timeout:8000});
  }

  const needy = [...fridges].filter(f=>f.status==='active').sort((a,b)=>{
    const at=a.last_refill_at?new Date(a.last_refill_at).getTime():0;
    const bt=b.last_refill_at?new Date(b.last_refill_at).getTime():0;
    return at-bt;
  }).slice(0,8);

  const visibleZones = showAllZones ? zones : zones.slice(0,5);

  return (
    <div style={{maxWidth:640,margin:"0 auto",padding:"32px 24px 64px"}}>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:32,height:32,borderRadius:8,background:DK,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>🧺</div>
          <span style={{fontFamily:DF,fontWeight:800,fontSize:13,color:DK,letterSpacing:0.3}}>TOGETHER FOR GOOD</span>
        </div>
        <a href="index.html" style={{fontSize:14,color:DK,textDecoration:"none",fontWeight:700,display:"flex",alignItems:"center",gap:6}}>🏠 Home</a>
      </div>

      <div style={{display:"flex",gap:16,alignItems:"center",marginTop:32}}>
        <img src={PLACEHOLDER} style={{width:"42%",height:150,objectFit:"cover",borderRadius:20,flexShrink:0}}/>
        <div style={{width:"58%",minWidth:0}}>
          <h1 className="spartan" style={{fontSize:"clamp(28px,9vw,48px)",lineHeight:1.08,color:DK}}>Find a<br/>Fridge</h1>
          <div style={{color:MT,fontSize:14,marginTop:16}}>{fridges.length||101} community fridges across Qatar.</div>
          <button onClick={detect} style={{width:"100%",marginTop:24,background:DK,color:"#fff",border:"none",borderRadius:30,padding:16,fontWeight:700,fontSize:15,fontFamily:BF,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            📍 {locStatus==="locating"?"Locating…":locStatus==="done"?"Location set ✓":"Detect my location"}
          </button>
          <div style={{textAlign:"center",color:MT2,fontSize:12,margin:"12px 0"}}>or</div>
          <select value={selectedZone} onChange={e=>setSelectedZone(e.target.value)} style={{width:"100%",border:`2px solid ${DK}`,color:DK,borderRadius:30,padding:16,fontWeight:700,fontSize:15,fontFamily:BF,textAlign:"center",background:"#fff",cursor:"pointer"}}>
            <option value="">Select Location ▾</option>
            {zones.map(([name,count])=><option key={name} value={name}>{name} ({count})</option>)}
          </select>
          {locStatus==="error" && <div style={{color:"#B5591A",fontSize:11.5,marginTop:8}}>Couldn't get your location — try Select Location instead.</div>}
        </div>
      </div>

      <hr style={{border:"none",borderTop:"1px solid #E5E7EB",margin:"44px 0 20px"}}/>

      <div>
        <div style={{fontSize:13,letterSpacing:0.4,textTransform:"uppercase",color:MT,fontWeight:700}}>Needs You Most</div>
        <div style={{color:MT2,fontSize:12,marginTop:4,marginBottom:16}}>Longest since last refill — swipe for more →</div>
        <div style={{display:"flex",gap:16,overflowX:"auto",paddingBottom:8,margin:"0 -24px",padding:"0 24px 8px"}}>
          {loading ? [1,2,3,4].map(i=><div key={i} style={{flexShrink:0,width:148,height:180,background:"#F3F3F3",borderRadius:16}}/>) :
            needy.map((f,i)=>(
            <div key={f.id} style={{flexShrink:0,width:148}}>
              <div style={{position:"relative",width:148,height:110,borderRadius:16,overflow:"hidden",background:"#F3F3F3"}}>
                <span style={{position:"absolute",top:8,left:8,width:22,height:22,borderRadius:"50%",background:"#fff",color:DK,fontFamily:DF,fontWeight:900,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.15)",zIndex:2}}>{i+1}</span>
                <img src={f.photo_url||PLACEHOLDER} onError={e=>e.target.src=PLACEHOLDER} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
              </div>
              <div style={{fontWeight:600,fontSize:13,marginTop:9,color:"#374151"}}>{f.name_en}</div>
              <div style={{fontSize:11,color:MT2,marginTop:2}}>{f.code} · {f.zone_name}</div>
              <div style={{fontSize:11,fontWeight:700,color:DK,marginTop:4}}>{timeAgo(f.last_refill_at)}</div>
            </div>
          ))}
        </div>
      </div>

      <hr style={{border:"none",borderTop:"1px solid #E5E7EB",margin:"44px 0 20px"}}/>

      <div>
        <div style={{fontSize:13,letterSpacing:0.4,textTransform:"uppercase",color:MT,fontWeight:700}}>Recent Activity</div>
        <div style={{color:MT2,fontSize:12,marginTop:4,marginBottom:12}}>The latest refills and cleanings.</div>
        {loading ? <div style={{color:MT2,fontSize:14}}>Loading…</div> :
          activity.length===0 ? <div style={{color:MT2,fontSize:14}}>No activity logged yet.</div> :
          activity.map(a=>(
          <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 0",borderBottom:"1px solid #F0F0F0",fontSize:14}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:DK,flexShrink:0}}></span>
            <span style={{color:"#374151"}}>{a.fridges?.name_en} · {a.fridges?.code} — {a.activity_type==='cleaning'?'cleaned':'refilled'}</span>
            <span style={{marginLeft:"auto",color:MT2,fontSize:12,flexShrink:0}}>{timeAgo(a.created_at)}</span>
          </div>
        ))}
      </div>

      <hr style={{border:"none",borderTop:"1px solid #E5E7EB",margin:"44px 0 20px"}}/>

      <div>
        <div style={{fontSize:13,letterSpacing:0.4,textTransform:"uppercase",color:MT,fontWeight:700}}>Explore By Area</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:16}}>
          {visibleZones.map(([name,count])=>(
            <button key={name} onClick={()=>setSelectedZone(name)} style={{
              border:`2px solid ${DK}`,borderRadius:24,padding:"9px 18px",fontSize:13.5,fontWeight:600,fontFamily:BF,cursor:"pointer",
              background: selectedZone===name ? DK : "#fff", color: selectedZone===name ? "#fff" : DK
            }}>{name}</button>
          ))}
          {!showAllZones && zones.length>5 && (
            <button onClick={()=>setShowAllZones(true)} style={{border:`2px solid ${DK}`,color:DK,background:"#fff",borderRadius:24,padding:"9px 18px",fontSize:13.5,fontWeight:600,fontFamily:BF,cursor:"pointer"}}>+ More</button>
          )}
        </div>
      </div>

      <a href="fridge-log.html" style={{display:"block",textAlign:"center",background:DK,color:"#fff",borderRadius:30,padding:16,fontWeight:700,fontSize:15,fontFamily:BF,textDecoration:"none",marginTop:44}}>
        ♡ Log a refill or cleaning
      </a>

      <div style={{textAlign:"center",color:MT,fontSize:12.5,marginTop:22}}>Together, we can keep good food moving. 💚</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
