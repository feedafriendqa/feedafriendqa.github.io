<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RSVP — Qatar Sustainability Week</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<meta name="robots" content="noindex"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#056839;font-family:Poppins,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;color:#0A3D1F}
.logo{height:64px;margin:8px 0 20px}
.card{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:26px 22px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.kick{font-size:11px;letter-spacing:2px;font-weight:700;color:#056839;margin-bottom:8px}
h1{font-family:'League Spartan',sans-serif;font-weight:900;font-size:26px;line-height:1.15;margin-bottom:8px}
.hi{color:#4B7C5A;font-size:14px;margin-bottom:14px}
.box{border:1px solid #BBF7D0;border-left:4px solid #16a34a;border-radius:10px;padding:12px 14px;margin:14px 0 18px;font-size:14px;line-height:1.7}
.btns{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
button{font-family:inherit;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;color:#fff}
.yes{background:#056839}.no{background:#374151}
button.sel{outline:3px solid #0A3D1F;outline-offset:2px}
textarea{width:100%;border:1.5px solid #BBF7D0;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;min-height:70px;margin:6px 0 8px;color:#0A3D1F}
.save{background:#0A3D1F;width:100%}
.small{font-size:12px;color:#6b7280;text-align:center;margin-top:14px}
.err{color:#991B1B;font-weight:600;text-align:center;font-size:15px}
a{color:#056839;font-weight:600}
</style>
</head>
<body>
<img class="logo" src="https://xbxagukdvgyaoqvbqoic.supabase.co/storage/v1/object/public/avatars/Faflogowhite.png" alt="Feed a Friend"/>
<div class="card" id="card"><p class="hi">Loading…</p></div>
<script>
const API="https://xbxagukdvgyaoqvbqoic.supabase.co/functions/v1/qsw-rsvp";
const p=new URLSearchParams(location.search), token=p.get("t"), preset=p.get("r");
const card=document.getElementById("card");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
async function call(body){
  const url=API+"?t="+encodeURIComponent(token)+(!body&&preset?"&r="+encodeURIComponent(preset):"");
  const res=await fetch(url,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({t:token},body))}:undefined);
  const j=await res.json(); if(!res.ok) throw new Error(j.error||"Something went wrong"); return j;
}
function render(d){
  card.replaceChildren();
  card.append(el("div","kick","QATAR SUSTAINABILITY WEEK 2026"));
  const yes=d.rsvp==="yes", no=d.rsvp==="no";
  card.append(el("h1",null,yes?"You're in. See you there!":no?"Thanks for letting us know":"Will you be attending?"));
  card.append(el("p","hi",(d.first_name?"Hi "+d.first_name+" · ":"")+d.event_title));
  const box=el("div","box");
  if(d.event_date) box.append(el("div",null,"📅 "+d.event_date+(d.event_time?" · "+d.event_time:"")));
  box.append(el("div",null,"📍 Together for Good HQ, Unit 36, Floor 2, Building 32, Street 205, Zone 56, Ain Khaled, Doha"));
  card.append(box);
  if(no) card.append(el("p","hi","No problem. Thanks for telling us, we hope to see you at another session."));
  const btns=el("div","btns");
  const b1=el("button","yes"+(yes?" sel":""),"I'm attending"), b2=el("button","no"+(no?" sel":""),"Can't attend");
  b1.onclick=()=>save("yes"); b2.onclick=()=>save("no");
  btns.append(b1,b2); card.append(btns);
  const note=el("textarea"); note.placeholder="Add a note for us (optional)"; note.value=d.rsvp_note||""; card.append(note);
  const sv=el("button","save","Save note"); sv.onclick=async()=>{sv.textContent="Saving…";try{render(await call({note:note.value}));}catch(e){sv.textContent=e.message;}}; card.append(sv);
  const s=el("p","small"); s.append(Object.assign(el("a",null,"All Sustainability Week sessions"),{href:"https://connect.feedafriend.org/QSW.html"})); card.append(s);
}
async function save(r){try{render(await call({r}));}catch(e){card.replaceChildren(el("p","err",e.message));}}
(async()=>{
  if(!token){card.replaceChildren(el("p","err","This link isn't valid."));return;}
  try{render(await call());}catch(e){card.replaceChildren(el("p","err",e.message));}
})();
</script>
</body>
</html>
