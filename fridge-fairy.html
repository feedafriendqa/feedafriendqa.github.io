<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Is the Fridge Fairy?</title>
<meta name="description" content="An animated story for little ones, from the Feed a Friend book Who Is the Fridge Fairy? by Alliyah Choudhury.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* Layout concept: one pinned watercolour street that the camera travels through as you scroll; a slim caption card sits under it. Pages are moments, not separate pictures: characters walk, the sky turns to evening, food appears. */
:root{
  --bg:#e8f2f9; --fg:#1f2f3a; --muted:#52646f; --card:#fffdf8; --ink:#1f2f3a; --accent:#2a7a55; --line:#c8dbe7;
  --sky-a:#a9d6ee; --sky-b:#e9f5fb; --sun:#ffd35c; --sunedge:#f0a81c;
  --dsk-a:#f08a5d; --dsk-b:#ffd7a3; --dsk-sun:#ff7a45; --tint:#ff9a55;
  --wall:#e2bb86; --wall-shade:#c99a62; --window:#8b5a3a; --ground:#ecd9b6; --path:#d6bd8e;
  --bougain:#d9457f; --bougain-2:#f07aa6; --leaf:#3f8a5f; --trunk:#8a6a45;
  --fridge:#2f7a57; --fridge-dark:#1f5a40; --glass:#dff3fb; --inside:#f4fbf8; --shelf:#b9d8cd; --handle:#c9d6d2;
  --shadow:rgba(60,40,20,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a24; --fg:#eef2ee; --muted:#a8b8bf; --card:#1a2a36; --ink:#eef2ee; --accent:#5ac795; --line:#2a3d4b;
  --sky-a:#1b3a5c; --sky-b:#3d6286; --sun:#ffe28a; --sunedge:#f0b74a;
  --dsk-a:#2a2350; --dsk-b:#7a4a6a; --dsk-sun:#ffcf8a; --tint:#5a3a8a;
  --wall:#7d6249; --wall-shade:#5f4a37; --window:#f3c76b; --ground:#38363a; --path:#4a4850;
  --bougain:#e5679b; --bougain-2:#f08fb4; --leaf:#4aa573; --trunk:#a58660;
  --fridge:#3b9068; --fridge-dark:#235a42; --glass:#3a5f70; --inside:#20373a; --shelf:#3b5a58; --handle:#8aa09b;
  --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a24; --fg:#eef2ee; --muted:#a8b8bf; --card:#1a2a36; --ink:#eef2ee; --accent:#5ac795; --line:#2a3d4b;
  --sky-a:#1b3a5c; --sky-b:#3d6286; --sun:#ffe28a; --sunedge:#f0b74a;
  --dsk-a:#2a2350; --dsk-b:#7a4a6a; --dsk-sun:#ffcf8a; --tint:#5a3a8a;
  --wall:#7d6249; --wall-shade:#5f4a37; --window:#f3c76b; --ground:#38363a; --path:#4a4850;
  --bougain:#e5679b; --bougain-2:#f08fb4; --leaf:#4aa573; --trunk:#a58660;
  --fridge:#3b9068; --fridge-dark:#235a42; --glass:#3a5f70; --inside:#20373a; --shelf:#3b5a58; --handle:#8aa09b;
  --shadow:rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Fredoka',system-ui,sans-serif;font-weight:500;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.track{max-width:860px;margin:0 auto;height:100svh}
.pin{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding-block:8px}
.prog{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:5px;transform-origin:left;transform:scaleX(0)}
.stage{position:relative;min-height:0;width:100%;height:100%;align-self:center;max-height:calc(min(860px,100vw - 32px)*1.3);border-radius:26px;overflow:hidden;background:linear-gradient(var(--sky-a) 0 58%,var(--ground) 58% 100%);box-shadow:0 10px 32px -14px rgba(20,50,70,.45)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{background:var(--card);border-radius:22px;padding:.8rem 1.1rem;text-align:center;min-height:4.6rem;max-height:44svh;overflow:auto;
  box-shadow:0 6px 20px -14px rgba(20,50,70,.5);display:flex;flex-direction:column;justify-content:center}
.inner{transition:opacity .3s,transform .3s}
.cap.empty{display:none}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.nb{font:inherit;font-weight:700;font-size:1.15rem;min-height:52px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;padding:0 1rem;-webkit-tap-highlight-color:transparent}
.nb.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.nb:disabled{opacity:.3;cursor:default}
.nb:focus-visible{outline:3px solid var(--sunedge);outline-offset:3px}
.cnt{font-weight:600;color:var(--muted);font-size:1rem;min-width:4.6rem;text-align:center}
.cap.swap .inner{opacity:0;transform:translateY(8px)}
.cap p{margin:0 0 .45rem;font-size:clamp(1.12rem,3.7vw,1.5rem);line-height:1.3;text-wrap:balance;color:var(--ink)}
.cap p:last-child{margin-bottom:0}
.cap h1{margin:0;font-weight:700;font-size:clamp(1.9rem,8vw,3rem);line-height:1.05;text-wrap:balance}
.cap h1 em{font-style:normal;color:var(--accent)}
.cap .by{color:var(--muted);font-size:1.05rem;margin-top:.4rem}
.cap .go{color:var(--muted);font-weight:600;font-size:.95rem;margin-top:.5rem}
.cap .go i{display:inline-block;font-style:normal;animation:nudge 1.4s ease-in-out infinite}
.chip{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:.15rem .8rem;font-size:.9rem;font-weight:600}
.tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:.2rem .9rem;font-weight:700}
.cap .about{font-size:.88rem;color:var(--muted);line-height:1.4}
.cap .mission{font-weight:700;color:var(--accent)}
.again{font:inherit;font-weight:600;background:none;border:2px solid var(--line);color:var(--fg);border-radius:999px;padding:.35rem 1rem;cursor:pointer;margin-top:.4rem}
.again:focus-visible,.fr:focus-visible{outline:3px solid var(--sunedge);outline-offset:3px}
.stage text{font-family:'Fredoka',system-ui,sans-serif}

/* scene motion */
#ov{opacity:0;pointer-events:none;transform-origin:400px 430px;transition:opacity .9s ease,transform 1.8s cubic-bezier(.45,.05,.25,1)}
.ko #ov{opacity:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #ov{filter:brightness(.62)}}
:root[data-theme="dark"] #ov{filter:brightness(.62)}
#cam{transition:transform 1.8s cubic-bezier(.45,.05,.25,1)}
.sky-dusk,.sun-dusk,.tint{opacity:0;transition:opacity 1.8s ease}
.sun-day{transition:opacity 1.8s ease}
.dk .sky-dusk,.dk .sun-dusk{opacity:1}.dk .sun-day{opacity:0}.dk .tint{opacity:.24}
.glow{opacity:0;transition:opacity 1.2s}
.gl .glow{opacity:.3;animation:glowp 3s ease-in-out infinite alternate}
.cloud{animation:drift 28s ease-in-out infinite alternate}
.sway{transform-origin:100px 212px;animation:sway 5s ease-in-out infinite alternate}
.act{transition:transform 1.7s cubic-bezier(.45,.05,.25,1),opacity .5s;cursor:pointer}
.act .in-ch{transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s}
.act.lean .in-ch{transform:rotate(-9deg)}
.act.walking .in-ch{animation:bob .5s ease-in-out infinite alternate}
.act.hop .in-ch{animation:hop .55s ease-out}
.tote{opacity:0;transition:opacity .6s}.tote.on{opacity:1}
.bub,.hsp{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.bub.on{animation:popin .6s cubic-bezier(.3,1.7,.5,1) .9s both}
.hsp.on{opacity:1;animation:twinkle 1.8s ease-in-out infinite}
.item{animation:popin .6s cubic-bezier(.3,1.7,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
.item.out{animation:popout .4s ease-in forwards}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out var(--d,0s) infinite}
.heart{transform-box:fill-box;transform-origin:center bottom;animation:floatup 3.2s ease-in var(--d,0s) infinite}
.fr{cursor:pointer}
.door{transform-box:fill-box;transition:transform .8s cubic-bezier(.3,1.2,.4,1)}
.door.l{transform-origin:left center}.door.r{transform-origin:right center}
.fr.open .door{transform:scaleX(.14)}
.init *{transition:none!important}
@keyframes popin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes popout{to{opacity:0;transform:scale(0)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes hop{30%{transform:translateY(-16px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(60px)}}
@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes floatup{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.1)}}
@keyframes glowp{from{opacity:.16}to{opacity:.34}}
@keyframes nudge{50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bub.on{opacity:1;transform:none}.item{opacity:1}}
</style>
