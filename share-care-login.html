<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | Share &amp; Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#717EC4; --accent-dark:#454E78; --green:#08752F; --green-dark:#065923;
  --charcoal:#2B2F2C; --muted:#6B7570; --line:#EBEAE3; --panel:#F3F5F0;
}
*{box-sizing:border-box;}
body{margin:0;background:#fff;color:var(--charcoal);font-family:'Nunito Sans',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2{font-family:'Plus Jakarta Sans';margin:0;font-weight:800;letter-spacing:-0.01em;}
a{text-decoration:none;color:inherit;}
button,input{font-family:'Nunito Sans';}
svg{display:block;}
.icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon svg{width:100%;height:100%;}
.max{max-width:520px;margin:0 auto;padding:0 20px;}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line);position:relative;}
.tb-logo img{height:34px;}
.header-right{display:flex;align-items:center;gap:10px;}
.menu-btn{width:36px;height:36px;border-radius:50%;background:var(--green);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.menu-btn .icon{width:16px;height:16px;color:#fff;}
.nav-menu{position:absolute;top:60px;right:20px;z-index:10;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:8px;min-width:200px;display:none;flex-direction:column;box-shadow:0 14px 40px rgba(20,30,15,.14);}
.nav-menu.open{display:flex;}
.nav-menu a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--charcoal);}
.nav-menu a:hover{background:var(--panel);}
.nav-menu a .icon{width:16px;height:16px;color:var(--accent-dark);}
.nav-menu hr{border:none;border-top:1px solid var(--line);margin:6px 4px;}
.lang-pill{border:1px solid var(--green);background:#fff;color:var(--green);font-weight:700;font-size:12px;
  padding:7px 15px;border-radius:999px;font-family:Cairo,'Nunito Sans',sans-serif;}

.hero-strip{background:#D9E3D9;padding:26px 20px 22px;color:#41504A;}
.hero-strip .eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-bottom:6px;}
.hero-strip h1{font-size:22px;margin-bottom:9px;}
.hero-strip p{font-size:13.5px;line-height:1.55;margin:0;opacity:.9;max-width:420px;}

.photo-hero{position:relative;height:200px;overflow:hidden;}
.photo-hero img{width:100%;height:100%;object-fit:cover;object-position:30% 60%;display:block;}
.photo-hero .overlay{position:absolute;inset:0;background:linear-gradient(0deg, rgba(6,89,35,.55) 0%, rgba(6,89,35,0) 55%);}
.photo-hero .caption{position:absolute;bottom:14px;left:20px;right:20px;}
.photo-hero .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:#fff;text-transform:uppercase;opacity:.9;margin-bottom:2px;}
.photo-hero h1{font-size:22px;color:#fff;}

.auth-gate{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:6px;margin-top:22px;box-shadow:0 4px 18px rgba(20,30,15,.05);}
.auth-tabs{display:flex;gap:6px;background:var(--panel);border-radius:14px;padding:5px;margin-bottom:0;}
.auth-tab{flex:1;text-align:center;padding:11px;border-radius:10px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;}
.auth-tab.active{background:#fff;color:var(--green-dark);box-shadow:0 2px 6px rgba(0,0,0,.06);}
.auth-panel{padding:14px 16px 18px;display:none;}
.auth-panel.show{display:block;}
.field-group{margin-bottom:16px;}
.field-label{display:block;font-weight:800;font-size:13px;color:var(--charcoal);margin-bottom:7px;}
.field-hint{display:block;font-weight:600;font-size:11px;color:var(--muted);margin-top:5px;}
.field-hint.error{color:#B3382A;}
.field-hint.ok{color:var(--green-dark);}
.text-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;color:var(--charcoal);background:#fff;}
.text-input:focus{outline:none;border-color:var(--green);}
.autocomplete-wrap{position:relative;}
.autocomplete-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  max-height:200px;overflow-y:auto;z-index:5;display:none;box-shadow:0 8px 24px rgba(20,20,10,.1);}
.autocomplete-list.show{display:block;}
.autocomplete-item{padding:10px 14px;font-size:13.5px;cursor:pointer;}
.autocomplete-item:hover{background:var(--panel);}
.auth-error{color:#B3382A;font-size:12px;font-weight:700;margin-top:6px;display:none;}
.auth-submit-btn{width:100%;background:var(--green);color:#fff;font-weight:800;font-size:14px;padding:14px;border:none;
  border-radius:999px;margin-top:12px;}
.auth-submit-btn:disabled{opacity:.55;}
.redirect-note{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;}

footer{text-align:center;padding:30px 20px 40px;font-family:'Plus Jakarta Sans';font-weight:800;color:var(--green);
  font-size:16px;display:flex;align-items:center;justify-content:center;gap:7px;}

html[dir="rtl"] body{direction:rtl;}
html[dir="rtl"] header{flex-direction:row-reverse;}
html[dir="rtl"] .header-right{flex-direction:row-reverse;}
html[dir="rtl"] .nav-menu{right:auto;left:20px;}
html[dir="rtl"] .nav-menu a{flex-direction:row-reverse;}
html[dir="rtl"] .photo-hero .caption{text-align:right;}
html[dir="rtl"] footer{flex-direction:row-reverse;}
</style>
</head>

<div class="max">
  <p style="font-size:13px;color:var(--muted);margin:18px 0 0;line-height:1.5;" data-en="Log in or create an account — it works across Post an Item, Request an Item, and every other Feed a Friend portal." data-ar="سجّل الدخول أو أنشئ حساباً — يعمل في نشر الأغراض وطلبها، وفي جميع منصات فيد أ فريند الأخرى.">Log in or create an account — it works across Post an Item, Request an Item, and every other Feed a Friend portal.</p>

  <div class="auth-gate" id="authGate">
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login" data-en="Log In" data-ar="تسجيل الدخول">Log In</div>
      <div class="auth-tab" data-tab="register" data-en="Register" data-ar="إنشاء حساب">Register</div>
    </div>

    <div class="auth-panel show" id="loginPanel">
      <div class="field-group">
        <label class="field-label" data-en="Email" data-ar="البريد الإلكتروني">Email</label>
        <input class="text-input" type="email" id="loginEmail" required>
      </div>
      <div class="field-group" style="margin-bottom:0;">
        <label class="field-label" data-en="Password" data-ar="كلمة المرور">Password</label>
        <input class="text-input" type="password" id="loginPassword" required>
      </div>
      <span class="auth-error" id="loginError"></span>
      <button type="button" class="auth-submit-btn" id="loginBtn" data-en="Log In" data-ar="تسجيل الدخول">Log In</button>
    </div>

    <div class="auth-panel" id="registerPanel">
      <div class="field-group">
        <label class="field-label" data-en="Full name" data-ar="الاسم الكامل">Full name</label>
        <input class="text-input" type="text" id="regName" required>
      </div>
      <div class="field-group">
        <label class="field-label" data-en="Choose a username" data-ar="اختر اسم مستخدم">Choose a username</label>
        <input class="text-input" type="text" id="regUsername" autocapitalize="off" autocomplete="off" required>
        <span class="field-hint" id="regUsernameHint"></span>
      </div>
      <div class="field-group">
        <label class="field-label" data-en="Email" data-ar="البريد الإلكتروني">Email</label>
        <input class="text-input" type="email" id="regEmail" required>
      </div>
      <div class="field-group">
        <label class="field-label" data-en="Password" data-ar="كلمة المرور">Password</label>
        <input class="text-input" type="password" id="regPassword" required>
      </div>
      <div class="field-group">
        <label class="field-label" data-en="WhatsApp number" data-ar="رقم الواتساب">WhatsApp number</label>
        <input class="text-input" type="tel" id="regPhone" placeholder="+974 5X XX XX XX" required>
      </div>
      <div class="field-group" style="margin-bottom:0;">
        <label class="field-label" data-en="Location" data-ar="الموقع">Location</label>
        <div class="autocomplete-wrap">
          <input class="text-input" type="text" id="regLocation" autocomplete="off" placeholder="Start typing your area..." required>
          <div class="autocomplete-list" id="regLocationList"></div>
        </div>
      </div>
      <span class="auth-error" id="registerError"></span>
      <button type="button" class="auth-submit-btn" id="registerBtn" data-en="Create Account" data-ar="إنشاء الحساب">Create Account</button>
    </div>
  </div>
  <p class="redirect-note" id="redirectNote"></p>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';document.head.appendChild(s);"></script>
<script>
  const SUPABASE_URL = "https://xbxagukdvgyaoqvbqoic.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhieGFndWtkdmd5YW9xdmJxb2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDExNDAsImV4cCI6MjA5NTYxNzE0MH0.-NifUdfkr9cZIDDtKNl5aQe9WMZab7l4boAJDAgfb-4";

  function initApp(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentLang = 'en';

  // Where to send the person once they're signed in — e.g. login.html?redirect=post-item.html
  const params = new URLSearchParams(window.location.search);
  const redirectTo = params.get('redirect') || 'share-care-post-item.html';

  function setLang(lang){
    currentLang = lang;
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.querySelectorAll('[data-en]').forEach(el => {
      const text = lang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
      if (text !== null) el.textContent = text;
    });
    const toggleBtn = document.getElementById('langToggleBtn');
    if (toggleBtn) toggleBtn.textContent = lang === 'ar' ? toggleBtn.getAttribute('data-ar') : toggleBtn.getAttribute('data-en');
    document.getElementById('redirectNote').textContent = currentLang === 'ar'
      ? `سنعيدك بعد تسجيل الدخول إلى: ${redirectTo}`
      : `You'll be sent back to: ${redirectTo}`;
  }
  setLang('en');
  document.getElementById('langToggleBtn').addEventListener('click', () => setLang(currentLang === 'ar' ? 'en' : 'ar'));

  const menuBtn = document.getElementById('menuToggleBtn');
  const navMenu = document.getElementById('navMenu');
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    navMenu.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!navMenu.contains(e.target) && e.target !== menuBtn) navMenu.classList.remove('open');
  });

  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('show'));
      tab.classList.add('active');
      document.getElementById(tab.getAttribute('data-tab') + 'Panel').classList.add('show');
    });
  });

  // If already signed in, skip straight to the redirect target
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = redirectTo;
  })();

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    if (error) {
      errEl.textContent = currentLang === 'ar' ? 'بيانات تسجيل الدخول غير صحيحة.' : 'Incorrect email or password.';
      errEl.style.display = 'block';
      return;
    }
    window.location.href = redirectTo;
  });

  let regUsernameAvailable = false;
  let regUsernameTimer = null;
  document.getElementById('regUsername').addEventListener('input', (e) => {
    const val = e.target.value.trim();
    const hint = document.getElementById('regUsernameHint');
    regUsernameAvailable = false;
    clearTimeout(regUsernameTimer);
    if (val.length < 3) { hint.textContent = ''; return; }
    hint.className = 'field-hint';
    hint.textContent = currentLang === 'ar' ? 'جارٍ التحقق...' : 'Checking availability...';
    regUsernameTimer = setTimeout(async () => {
      const { data } = await sb.from('share_care_account_username_check').select('username').eq('username', val).maybeSingle();
      if (data) {
        hint.className = 'field-hint error';
        hint.textContent = currentLang === 'ar' ? 'مُستخدم بالفعل — جرّب آخر.' : 'Already taken — try another.';
        regUsernameAvailable = false;
      } else {
        hint.className = 'field-hint ok';
        hint.textContent = currentLang === 'ar' ? 'متاح' : 'Available';
        regUsernameAvailable = true;
      }
    }, 500);
  });

  let regAllLocations = [];
  (async () => {
    const { data } = await sb.from('distribution_locations').select('name').eq('active', true).order('sort_order');
    if (data) regAllLocations = data.map(d => d.name);
  })();
  const regLocInput = document.getElementById('regLocation');
  const regLocList = document.getElementById('regLocationList');
  regLocInput.addEventListener('input', () => {
    const q = regLocInput.value.trim().toLowerCase();
    if (!q) { regLocList.classList.remove('show'); return; }
    const matches = regAllLocations.filter(n => n.toLowerCase().includes(q)).slice(0, 8);
    regLocList.innerHTML = matches.map(n => `<div class="autocomplete-item" data-val="${n}">${n}</div>`).join('');
    regLocList.classList.toggle('show', matches.length > 0);
    regLocList.querySelectorAll('.autocomplete-item').forEach(item => {
      item.addEventListener('click', () => { regLocInput.value = item.getAttribute('data-val'); regLocList.classList.remove('show'); });
    });
  });
  document.addEventListener('click', (e) => { if (!regLocInput.contains(e.target) && !regLocList.contains(e.target)) regLocList.classList.remove('show'); });

  document.getElementById('registerBtn').addEventListener('click', async () => {
    const fullName = document.getElementById('regName').value.trim();
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const phone = document.getElementById('regPhone').value.trim();
    const location = document.getElementById('regLocation').value.trim();
    const errEl = document.getElementById('registerError');
    errEl.style.display = 'none';
    errEl.style.color = '#B3382A';

    if (!fullName || !username || !regUsernameAvailable || !email || !password || !phone || !location) {
      errEl.textContent = currentLang === 'ar' ? 'يرجى إكمال جميع الحقول باسم مستخدم متاح.' : 'Please complete all fields with an available username.';
      errEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    const { data: signUpData, error: signUpError } = await sb.auth.signUp({ email, password });
    if (signUpError) {
      btn.disabled = false;
      errEl.textContent = signUpError.message;
      errEl.style.display = 'block';
      return;
    }

    if (!signUpData.session) {
      btn.disabled = false;
      errEl.style.color = 'var(--green-dark)';
      errEl.textContent = currentLang === 'ar' ? 'تحقق من بريدك الإلكتروني لتأكيد الحساب، ثم سجّل الدخول.' : 'Check your email to confirm your account, then log in.';
      errEl.style.display = 'block';
      return;
    }

    const { error: insertError } = await sb.from('share_care_accounts').insert({
      user_id: signUpData.user.id,
      full_name: fullName,
      username: username,
      phone: phone,
      email: email,
      location: location
    });
    btn.disabled = false;
    if (insertError) {
      errEl.textContent = insertError.message;
      errEl.style.display = 'block';
      return;
    }
    window.location.href = redirectTo;
  });
  }

  if (window.supabase) { initApp(); }
  else {
    document.addEventListener('DOMContentLoaded', () => {
      const check = setInterval(() => {
        if (window.supabase) { clearInterval(check); initApp(); }
      }, 100);
      setTimeout(() => clearInterval(check), 8000);
    });
  }
</script>
</body>
</html>
