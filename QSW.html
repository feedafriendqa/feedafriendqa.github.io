<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QSW 2026 Sign-Up</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme]{
    --bg:#1b7a43; --lime:#c6f24a; --ink-light:#dff0e4; --white:#ffffff;
    --card-ink:#14261a; --card-sub:#5d6359; --card-line:#d9ded6; --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--white);
    font-family:'Plus Jakarta Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--lime); text-decoration:none;}
  input, select, textarea{ font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .heading{ font-family:'Outfit',sans-serif; }

  .page{ min-height:100vh; padding:clamp(18px,5vw,34px) clamp(16px,5vw,28px) 64px; }
  .container{ max-width:880px; margin:0 auto; }

  .top{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:34px; }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand .name{ font-family:'Outfit',sans-serif; font-weight:800; font-size:15px; letter-spacing:-0.01em; }
  .brand .div{ width:1px; height:34px; background:rgba(255,255,255,.35); }
  .brand .tfg{ font-weight:700; font-size:13px; color:var(--ink-light); }
  .kicker{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--lime); line-height:1.6; text-align:right; }

  /* ---- Calendar view ---- */
  .hero{ font-family:'Outfit',sans-serif; font-weight:800; font-size:clamp(34px,9vw,52px); line-height:.95; color:var(--lime); letter-spacing:-0.035em; }
  .hero span{ color:#fff; }
  .lede{ font-size:15px; color:var(--ink-light); margin:18px 0 30px; max-width:460px; line-height:1.55; text-wrap:pretty; }

  .events{ display:flex; flex-direction:column; gap:2px; }
  .event{ border-top:2px solid rgba(255,255,255,.45); padding:20px 0; }
  .events::after{ content:""; display:block; border-top:2px solid rgba(255,255,255,.45); }
  .event-head{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; cursor:pointer; }
  .event-date{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--lime); width:74px; flex:none; line-height:1.5; }
  .event-date .dow{ color:var(--ink-light); }
  .event-main{ min-width:200px; flex:1; }
  .event-title-row{ display:flex; align-items:center; gap:10px; }
  .event-title{ font-family:'Outfit',sans-serif; font-weight:700; font-size:clamp(18px,4.6vw,22px); color:#fff; line-height:1.15; letter-spacing:-0.015em; }
  .chev{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--lime); flex:none; transition:transform .15s; }
  .event.open .chev{ transform:rotate(180deg); }
  .event-meta{ font-size:12.5px; color:var(--ink-light); margin-top:5px; }
  .event-spots{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--lime); margin-top:6px; letter-spacing:.04em; }
  .event-spots.full{ color:#ffb4a8; }
  .btn-signup{ flex:none; border:2px solid var(--lime); background:transparent; color:#fff; font-family:'Outfit',sans-serif; font-weight:700; font-size:13px; padding:12px 22px; border-radius:99px; cursor:pointer; white-space:nowrap; min-height:44px; }
  .btn-signup:hover{ background:var(--lime); color:#12351f; }
  .btn-signup:disabled{ opacity:.5; cursor:not-allowed; border-color:rgba(255,255,255,.35); }
  .public-tag{ flex:none; max-width:190px; font-size:12px; color:var(--ink-light); line-height:1.45; }
  .public-tag .k{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; color:var(--lime); }
  .event-detail{ margin:16px 0 4px; padding-left:clamp(0px,7vw,94px); max-width:560px; display:none; }
  .event.open .event-detail{ display:block; }
  .event-detail-desc{ font-size:13.5px; color:var(--ink-light); line-height:1.6; }
  .event-detail-grid{ display:flex; gap:26px; flex-wrap:wrap; margin-top:14px; }
  .event-detail-k{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--lime); }
  .event-detail-v{ font-size:13px; color:#fff; font-weight:600; margin-top:4px; }
  .event-detail-v .sub{ color:var(--ink-light); font-weight:400; }

  .footer-note{ margin-top:26px; display:flex; gap:26px; flex-wrap:wrap; font-size:13px; color:var(--ink-light); }
  .footer-note b{ color:#fff; }

  .conn-warning{ margin-top:18px; padding:12px 16px; border-radius:10px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; font-size:13px; font-weight:600; }

  /* ---- Form view ---- */
  .back-btn{ background:none; border:none; color:var(--lime); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; cursor:pointer; padding:0 0 18px; }
  .back-btn:hover{ color:#fff; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:clamp(20px,4vw,34px); align-items:start; }
  .session-title{ font-family:'Outfit',sans-serif; font-weight:800; font-size:clamp(27px,7vw,40px); line-height:1.02; color:#fff; letter-spacing:-0.03em; margin:10px 0 14px; }
  .session-desc{ font-size:14.5px; color:var(--ink-light); line-height:1.6; }
  .info-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:rgba(255,255,255,.3); margin-top:26px; border:1px solid rgba(255,255,255,.3); border-radius:14px; overflow:hidden; }
  .info-cell{ background:var(--bg); padding:16px 18px; }
  .info-k{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--lime); }
  .info-v{ color:#fff; font-weight:700; font-size:15px; margin-top:5px; }
  .info-sub{ color:var(--ink-light); font-size:12px; margin-top:3px; }

  .form-card{ background:var(--white); border-radius:18px; padding:clamp(18px,4vw,24px); min-width:0; }
  .form-heading{ font-family:'Outfit',sans-serif; font-weight:700; font-size:21px; color:var(--card-ink); letter-spacing:-0.015em; }
  .form-intro{ font-size:12.5px; color:var(--card-sub); margin-top:5px; line-height:1.5; }
  .mode-row{ display:flex; gap:8px; margin:18px 0 16px; }
  .mode-btn{ flex:1; border:1.5px solid var(--card-line); background:#fff; color:var(--card-sub); font-weight:700; font-size:12.5px; padding:11px 8px; border-radius:10px; cursor:pointer; min-height:44px; }
  .mode-btn.active{ border-color:var(--bg); background:var(--bg); color:#fff; }
  .field-col{ display:flex; flex-direction:column; gap:13px; }
  label.field{ display:block; }
  .field-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:var(--card-sub); }
  .field input[type=text], .field input[type=email], .field input[type=tel], .field textarea{
    width:100%; box-sizing:border-box; margin-top:5px; border:1.5px solid var(--card-line); border-radius:10px;
    padding:11px 12px; font-size:14px; color:var(--card-ink); outline:none; background:#fff;
  }
  .field textarea{ min-height:70px; resize:vertical; }
  .field input:focus, .field textarea:focus{ border-color:var(--bg); }
  .field-err{ font-size:11.5px; color:var(--danger); display:block; margin-top:4px; }
  .stepper{ display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .stepper button{ width:44px; height:44px; border:1.5px solid var(--card-line); background:#fff; border-radius:10px; font-size:19px; color:var(--card-ink); cursor:pointer; }
  .stepper button:hover{ border-color:var(--bg); }
  .stepper .count{ font-family:'Outfit',sans-serif; font-weight:700; font-size:20px; color:var(--card-ink); min-width:28px; text-align:center; }
  .stepper .note{ font-size:12px; color:#7c8177; line-height:1.4; }
  .consent-row{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; padding-top:2px; }
  .consent-row input{ width:18px; height:18px; margin:1px 0 0; accent-color:var(--bg); flex:none; }
  .consent-row span{ font-size:12.5px; color:var(--card-sub); line-height:1.45; }
  .sure-box{ background:#fff8e6; border:1.5px solid #e8c86a; border-radius:12px; padding:14px 16px; display:none; }
  .sure-box.show{ display:block; }
  .sure-box .t{ font-family:'Outfit',sans-serif; font-weight:700; font-size:15px; color:var(--card-ink); }
  .sure-box .d{ font-size:12.5px; color:var(--card-sub); line-height:1.5; margin-top:5px; }
  .sure-box .row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .sure-box .yes{ flex:1; min-width:140px; border:none; background:var(--bg); color:#fff; font-weight:700; font-size:13px; padding:12px; border-radius:10px; cursor:pointer; min-height:44px; }
  .sure-box .no{ flex:none; border:1.5px solid var(--card-line); background:#fff; color:var(--card-sub); font-weight:700; font-size:13px; padding:12px 14px; border-radius:10px; cursor:pointer; min-height:44px; }
  .submit-btn{ border:none; background:var(--bg); color:#fff; font-family:'Outfit',sans-serif; font-weight:700; font-size:15px; padding:15px; border-radius:12px; cursor:pointer; margin-top:4px; min-height:48px; width:100%; }
  .submit-btn:hover{ opacity:.9; }
  .submit-btn:disabled{ opacity:.55; cursor:not-allowed; }
  .submit-note{ font-size:11px; color:#7c8177; line-height:1.45; }
  .form-error{ font-size:12.5px; color:var(--danger); background:#fdeceb; border:1px solid #f3c6c1; border-radius:10px; padding:10px 12px; display:none; }
  .form-error.show{ display:block; }

  /* ---- Confirmation view ---- */
  .done-kicker{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--lime); }
  .done-heading{ font-family:'Outfit',sans-serif; font-weight:800; font-size:clamp(30px,8vw,48px); line-height:1; color:#fff; letter-spacing:-0.03em; margin:12px 0 14px; }
  .done-body{ font-size:15px; color:var(--ink-light); line-height:1.6; }
  .done-card{ background:#fff; border-radius:18px; padding:22px clamp(18px,4vw,24px); margin-top:26px; max-width:620px; }
  .done-title{ font-family:'Outfit',sans-serif; font-weight:700; font-size:20px; color:var(--card-ink); letter-spacing:-0.015em; }
  .done-grid{ display:flex; flex-wrap:wrap; gap:22px; margin-top:14px; }
  .done-k{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:#7c8177; }
  .done-v{ font-size:13.5px; color:var(--card-ink); font-weight:600; margin-top:4px; }
  .done-foot{ border-top:1px solid #e8ebe6; margin-top:18px; padding-top:16px; font-size:12.5px; color:var(--card-sub); line-height:1.5; }
  .done-back{ margin-top:24px; }
  .cal-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; padding-top:16px; border-top:1px solid #e8ebe6; }
  .cal-btn{
    display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--card-line); background:#fff;
    color:var(--card-ink); font-weight:700; font-size:12.5px; padding:9px 14px; border-radius:10px; cursor:pointer; text-decoration:none;
  }
  .cal-btn:hover{ border-color:var(--bg); color:var(--bg); }
  .cal-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:#7c8177; width:100%; margin-bottom:2px; }

  .social-row{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-light); }
  .social-row a{ display:inline-flex; align-items:center; gap:6px; color:var(--lime); font-weight:700; }
  .social-row a:hover{ color:#fff; }

  [hidden]{ display:none !important; }

  /* ---- Mobile tightening ---- */
  @media (max-width: 560px){
    .page{ padding:16px 16px 48px; }
    .top{ margin-bottom:20px; gap:10px; }
    .brand img:first-child{ height:32px !important; }
    .brand img:last-child{ height:38px !important; margin:0 !important; }
    .brand .div{ height:26px; }
    .kicker{ font-size:9.5px; line-height:1.5; }

    .hero{ font-size:30px; line-height:1.05; letter-spacing:-0.02em; }
    .lede{ font-size:13.5px; line-height:1.5; margin:12px 0 22px; max-width:none; }

    .events{ gap:0; }
    .event{ padding:14px 0; border-top-width:1px; }
    .events::after{ border-top-width:1px; }
    .event-head{ gap:10px; }
    .event-date{ width:44px; font-size:10.5px; line-height:1.35; }
    .event-title{ font-size:16px; line-height:1.2; }
    .event-meta{ font-size:11.5px; margin-top:3px; }
    .event-spots{ font-size:9.5px; margin-top:4px; }
    .btn-signup{ padding:9px 14px; font-size:11.5px; min-height:36px; }
    .public-tag{ font-size:10.5px; max-width:130px; }
    .public-tag .k{ font-size:9.5px; }
    .chev{ font-size:11px; }

    .event-detail{ padding-left:0; margin:12px 0 0; }
    .event-detail-desc{ font-size:12.5px; }
    .event-detail-grid{ gap:16px; margin-top:10px; }

    .footer-note{ flex-direction:column; gap:10px; font-size:12px; margin-top:20px; }

    .form-grid{ gap:20px; }
    .session-title{ font-size:26px; margin:8px 0 10px; }
    .session-desc{ font-size:13px; }
    .info-grid{ margin-top:18px; }
    .info-cell{ padding:12px 14px; }
    .form-card{ padding:16px; }
    .form-heading{ font-size:18px; }

    .done-heading{ font-size:30px; }
    .cal-row{ gap:6px; }
    .cal-btn{ font-size:11.5px; padding:8px 11px; }
  }
</style>
</head>

let openIndex = null;
let activeSession = null;
let spotsCache = {};

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function fetchSpots(key){
  if (spotsCache[key] !== undefined) return spotsCache[key];
  try {
    const { data, error } = await sb.rpc("qsw_spots_taken", { p_session_key: key });
    if (error) throw error;
    spotsCache[key] = data ?? 0;
  } catch (e) {
    console.warn("spots lookup failed", e);
    spotsCache[key] = null; // unknown — don't block signup
  }
  return spotsCache[key];
}

async function refreshSpotsUI(i){
  const s = sessions[i];
  const taken = await fetchSpots(s.key);
  const tag = document.getElementById("spots-" + i);
  const btn = document.getElementById("signupbtn-" + i);
  if (!tag) return;
  if (taken === null){
    tag.textContent = s.capacity + " spots available";
    return;
  }
  const left = Math.max(s.capacity - taken, 0);
  tag.textContent = left > 0 ? `${left} of ${s.capacity} spots left` : "Fully booked — waitlist open";
  tag.classList.toggle("full", left <= 0);
  if (btn && left <= 0){
    btn.textContent = "Join waitlist";
  }
}

function toggleEvent(i){
  openIndex = openIndex === i ? null : i;
  document.querySelectorAll(".event").forEach((el, idx) => el.classList.toggle("open", idx === openIndex));
}

// ---- Form state ----
let form = { mode: "solo", name: "", email: "", phone: "", company: "", people: 1, photos: true, names: [""] };
let err = {};
let askSure = false;

let knownFull = false;

function resetForm(){
  form = { mode: "solo", name: "", email: "", phone: "", company: "", people: 1, photos: true, names: [""] };
  err = {}; askSure = false; knownFull = false;
}

function submitLabel(){
  if (knownFull) return "Join waitlist" + (form.people > 1 ? ` (${form.people})` : "");
  return "Reserve " + (form.people > 1 ? form.people + " spots" : "my spot");
}

function openForm(i){
  activeSession = sessions[i];
  resetForm();
  document.getElementById("view-calendar").hidden = true;
  document.getElementById("view-done").hidden = true;
  document.getElementById("view-form").hidden = false;
  renderForm();
}

function goCalendar(){
  document.getElementById("view-form").hidden = true;
  document.getElementById("view-done").hidden = true;
  document.getElementById("view-calendar").hidden = false;
  spotsCache = {};
  renderCalendar();
}

function setMode(mode){
  form.mode = mode;
  if (mode === "team" && form.people < 2) form.people = 2;
  renderForm();
}

function stepPeople(delta){
  const next = form.people + delta;
  if (next < 1 || next > activeSession.capacity) return;
  form.people = next;
  while (form.names.length < form.people) form.names.push("");
  form.names.length = form.people;
  askSure = false;
  renderForm();
}

function renderForm(){
  const s = activeSession;
  const soloActive = form.mode === "solo";

      <div>

            <div class="info-k">SPOTS</div>
            <div class="info-v" id="form-spots">${s.capacity} total</div>
            <div class="info-sub">Held once you submit</div>
          </div>
          <div class="info-cell">
            <div class="info-k">WEAR</div>
            <div class="info-v">Comfy clothes</div>
            <div class="info-sub">Closed shoes, water bottle</div>
          </div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-heading">Reserve your spot${form.people > 1 ? "s" : ""}</div>

        <div class="field-col">

            <span class="field-label">FULL NAME</span>
            <input type="text" id="f-name" value="${esc(form.name)}" placeholder="Your name">
            <span class="field-err" ${err.name ? "" : "style='display:none'"}>Please add your name</span>
          </label>
          <label class="field">
            <span class="field-label">EMAIL</span>
            <input type="email" id="f-email" value="${esc(form.email)}" placeholder="you@company.qa">
            <span class="field-err" ${err.email ? "" : "style='display:none'"}>Please add a valid email</span>
          </label>
          <label class="field">
            <span class="field-label">MOBILE / WHATSAPP</span>
            <input type="tel" id="f-phone" value="${esc(form.phone)}" placeholder="+974 …">

    if (tag) tag.textContent = left > 0 ? left + " left of " + s.capacity : "Waitlist open";

function confirmSure(){
  askSure = false;
  submitForm();
}
function cancelSure(){
  askSure = false;
  renderForm();
}

function validate(){
  err = {};
  if (!form.name.trim()) err.name = true;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) err.email = true;
  if (!form.phone.trim()) err.phone = true;
  if (form.mode === "team" && !form.company.trim()) err.company = true;
  if (form.people < 1 || form.people > activeSession.capacity){
    err.people = true; err.peopleMsg = `Choose between 1 and ${activeSession.capacity} people.`;
  }
  const cleanNames = form.names.map(n => n.trim()).filter(Boolean);
  if (form.people > 1 && cleanNames.length !== form.people){
    err.names = true;
  }
  return Object.keys(err).length === 0;
}

async function submitForm(){
  if (!validate()){
    renderForm();
    return;
  }
  if (form.people >= 6 && !askSure){
    askSure = true;
    renderForm();
    return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = knownFull ? "Joining waitlist…" : "Reserving…";
  const errBox = document.getElementById("form-error");
  errBox.classList.remove("show");

  const attendeeNames = form.people > 1
    ? form.names.map(n => n.trim()).filter(Boolean)
    : [form.name.trim()];

  let isWaitlist = knownFull;
  try {
    const { data: takenNow, error: spotsErr } = await sb.rpc("qsw_spots_taken", { p_session_key: activeSession.key });
    if (!spotsErr && takenNow !== null) {
      isWaitlist = (takenNow + form.people) > activeSession.capacity;
    }
  } catch (e) {
    console.warn("fresh spots check failed, using last known state", e);
  }

  const row = {
    session_key: activeSession.key,
    event_title: activeSession.title,
    event_date: activeSession.isoDate,
    event_time: activeSession.time,
    event_location: activeSession.place,
    mode: form.mode,
    full_name: form.name.trim(),
    email: form.email.trim(),
    phone: form.phone.trim(),
    company: form.company.trim() || null,
    people_count: form.people,
    attendee_names: attendeeNames,
    photos_consent: !!form.photos,
    is_waitlist: isWaitlist,
  };

  try {
    const { error } = await sb.from("qsw_signups").insert(row);
    if (error) throw error;
    // Note: row.is_waitlist reflects our just-in-time check. In the rare case two
    // people fill the last spot at the exact same moment, the database trigger is
    // the final authority and may silently flip one to a waitlist entry server-side.

    // fire the confirmation + team notification emails (best-effort)
    fetch(MAILER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: {
          sessionKey: activeSession.key,
          title: activeSession.title,
          dateLabel: activeSession.dateLabel,
          time: activeSession.time,
          location: activeSession.place,
          isoDate: activeSession.isoDate,
          startTime: activeSession.startTime,
          endTime: activeSession.endTime,
        },
        signup: {
          fullName: row.full_name, email: row.email, phone: row.phone,
          mode: row.mode, company: row.company, peopleCount: row.people_count,
          attendeeNames, photosConsent: row.photos_consent, isWaitlist: row.is_waitlist,
        },
      }),
    }).catch(e => console.warn("mailer call failed", e));

    spotsCache[activeSession.key] = undefined;
    renderDone(row, attendeeNames);
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = submitLabel();
    errBox.textContent = (e && e.message) ? e.message : "Something went wrong — please try again.";
    errBox.classList.add("show");
  }
}

function pad2(n){ return String(n).padStart(2, "0"); }

function icsDateUTC(isoDate, hhmm){
  // Qatar is UTC+3 year-round — convert the local session time to a UTC
  // instant so the .ics renders correctly in any calendar app/timezone.
  const [y, mo, d] = isoDate.split("-").map(Number);
  const [h, mi] = hhmm.split(":").map(Number);
  const utcMs = Date.UTC(y, mo - 1, d, h - 3, mi);
  const dt = new Date(utcMs);
  return dt.getUTCFullYear() + pad2(dt.getUTCMonth() + 1) + pad2(dt.getUTCDate())
    + "T" + pad2(dt.getUTCHours()) + pad2(dt.getUTCMinutes()) + "00Z";
}

function buildIcs(s){
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Feed a Friend//QSW 2026//EN",
    "BEGIN:VEVENT",
    "UID:" + s.key + "-" + Date.now() + "@feedafriend.org",
    "DTSTAMP:" + icsDateUTC(s.isoDate, s.startTime),
    "DTSTART:" + icsDateUTC(s.isoDate, s.startTime),
    "DTEND:" + icsDateUTC(s.isoDate, s.endTime),
    "SUMMARY:" + s.title,
    "LOCATION:" + s.place,
    "DESCRIPTION:Qatar Sustainability Week 2026 \\u2014 Feed a Friend x Together for Good",
    "END:VEVENT", "END:VCALENDAR",
  ];
  return lines.join("\r\n");
}

function googleCalUrl(s){
  const start = icsDateUTC(s.isoDate, s.startTime);
  const end = icsDateUTC(s.isoDate, s.endTime);
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: s.title,
    dates: start + "/" + end,
    details: "Qatar Sustainability Week 2026 — Feed a Friend x Together for Good",
    location: s.place,
  });
  return "https://calendar.google.com/calendar/render?" + params.toString();
}

function icsDataUrl(s){
  const ics = buildIcs(s);
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}

function renderDone(row, attendeeNames){
  document.getElementById("view-form").hidden = true;
  const el = document.getElementById("view-done");
  el.hidden = false;
  const s = activeSession;
  const kicker = row.is_waitlist ? "YOU'RE ON THE WAITLIST" : "YOU'RE ON THE LIST";
  const heading = row.is_waitlist ? "You're on the waitlist" : "See you there!";
  const body = row.is_waitlist
    ? `This session is fully booked. You're first in line on the waitlist for ${esc(s.title)} — we'll email ${esc(row.email)} the moment a spot opens up.`
    : `A confirmation email is on its way to ${esc(row.email)} with everything you need, including a calendar invite.`;

  const calRow = row.is_waitlist ? "" : `
      <div class="cal-row">
        <div class="cal-label">ADD TO CALENDAR</div>
        <a class="cal-btn" href="${googleCalUrl(s)}" target="_blank" rel="noopener">📅 Google Calendar</a>
        <a class="cal-btn" href="${icsDataUrl(s)}" download="${s.key}.ics">🍎 Apple Calendar</a>
        <a class="cal-btn" href="${icsDataUrl(s)}" download="${s.key}.ics">📆 Outlook (.ics)</a>
      </div>`;

  el.innerHTML = `
    <div class="done-kicker">${kicker}</div>
    <div class="done-heading">${heading}</div>
    <div class="done-body">${body}</div>
    <div class="done-card">
      <div class="done-title">${esc(s.title)}</div>
      <div class="done-grid">
        <div><div class="done-k">WHEN</div><div class="done-v">${esc(s.dateLabel)}<br>${esc(s.time)}</div></div>
        <div><div class="done-k">WHERE</div><div class="done-v">${esc(s.locName)}<br>${esc(s.locSub)}</div></div>
        <div><div class="done-k">WHO</div><div class="done-v">${esc(attendeeNames.join(", "))}</div></div>
      </div>
      ${calRow}
      <div class="done-foot">Please arrive 10 minutes early. Questions any time: <a href="mailto:salaam@feedafriend.org" style="color:var(--card-ink);text-decoration:underline">salaam@feedafriend.org</a></div>
    </div>
    <div class="social-row" style="margin-top:20px">Follow us: <a href="https://instagram.com/feed.a.friend" target="_blank" rel="noopener">@feed.a.friend on Instagram ↗</a></div>
    <button class="back-btn done-back" onclick="goCalendar()">← BACK TO ALL SESSIONS</button>
  `;
}
