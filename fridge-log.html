const CREAM = "#FFFFFF";
const DK = "#15803D";
const OR = "#15803D";
const OR_LT = "#DCFCE7";
const OR_DK = "#B5591A";
const GR = "#22C55E";
const GR_LT = "#F0FDF4";
const MT = "#6B7280";
const BF = "Poppins,sans-serif";
const DF = "'League Spartan',sans-serif";

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function Toggle({label, value, onChange}){
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 0",borderBottom:"1px solid #F1E7D8"}}>
      <span style={{fontFamily:BF,fontSize:14,color:DK,fontWeight:600}}>{label}</span>
      <button onClick={()=>onChange(!value)} style={{
        width:48,height:28,borderRadius:20,border:"none",cursor:"pointer",position:"relative",
        background: value ? GR : "#E5DCC8", transition:"background 0.15s"
      }}>
        <div style={{
          width:22,height:22,borderRadius:"50%",background:"#fff",position:"absolute",top:3,
          left: value ? 23 : 3, transition:"left 0.15s", boxShadow:"0 1px 2px rgba(0,0,0,0.2)"
        }}/>
      </button>
    </div>
  );
}

function Sparkle({size=16, color}){
  const c = color || "currentColor";
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none" stroke={c} strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"middle"}}>
      <path d="M50 8 L58 40 L90 48 L58 56 L50 88 L42 56 L10 48 L42 40 Z"/>
      <path d="M78 12 L81 20 L89 23 L81 26 L78 34 L75 26 L67 23 L75 20 Z" fill={c} stroke="none"/>
    </svg>
  );
}

function App(){
  const [fridges,setFridges]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [session,setSession]=React.useState(null);
  const [profile,setProfile]=React.useState(null);
  const [asGuest,setAsGuest]=React.useState(false);

  const [fridgeCode,setFridgeCode]=React.useState(getParam("fridge")||"");
  const [activityType,setActivityType]=React.useState("refill");
  const [guestName,setGuestName]=React.useState("");
  const [isClean,setIsClean]=React.useState(true);
  const [isWorking,setIsWorking]=React.useState(true);
  const [notes,setNotes]=React.useState("");
  const [photoFile,setPhotoFile]=React.useState(null);
  const [submitting,setSubmitting]=React.useState(false);
  const [done,setDone]=React.useState(false);
  const [counterTarget,setCounterTarget]=React.useState(null);
  const [counterShown,setCounterShown]=React.useState(0);

  React.useEffect(()=>{
    if(!done) return;
    (async ()=>{
      const [{count:liveRefills},{data:stats}] = await Promise.all([
        sb.from("fridge_activity").select("id",{count:"exact",head:true}).eq("activity_type","refill"),
        sb.from("site_stats").select("legacy_refill_count").eq("id",1).single()
      ]);
      const total = (liveRefills||0) + (stats?.legacy_refill_count||0);
      setCounterTarget(total);
      const start = Math.max(total-24,0);
      let n = start;
      const step = ()=>{
        n += Math.max(1,Math.round((total-n)/8));
        if(n>=total){ setCounterShown(total); return; }
        setCounterShown(n);
        requestAnimationFrame(step);
      };
      setCounterShown(start);
      requestAnimationFrame(step);
      if(window.confetti){
        window.confetti({particleCount:120,spread:80,origin:{y:0.35},colors:["#15803D","#22C55E","#BBF7D0"]});
      }
    })();
  },[done]);
  const [error,setError]=React.useState("");
  const [photoUploadFailed,setPhotoUploadFailed]=React.useState(false);

  React.useEffect(()=>{
    sb.auth.getSession().then(({data})=>{
      setSession(data.session||null);
      if(data.session) loadProfile(data.session.user.id);
    });
    sb.auth.onAuthStateChange((_e,s)=>{
      setSession(s);
      if(s) loadProfile(s.user.id); else setProfile(null);
    });
    loadFridges();
  },[]);

  async function loadProfile(uid){
    const {data} = await sb.from("profiles").select("*").eq("id",uid).single();
    setProfile(data||null);
  }

  async function loadFridges(){
    const {data} = await sb.from("fridges").select("id,code,name_en,zone_name,status,map_link,lat,lng").order("zone_name");
    setFridges(data||[]);
    setLoading(false);
  }

  const selectedFridge = fridges.find(f=>f.code===fridgeCode);

  async function handleSubmit(){
    setError("");
    if(!selectedFridge){ setError("Choose which fridge you visited."); return; }
    setSubmitting(true);
    try{
      let photo_url = null;
      let photoFailed = false;
      if(photoFile){
        const path = `${Date.now()}_${photoFile.name}`;
        const {error:upErr} = await sb.storage.from("fridge-activity-photos").upload(path, photoFile);
        if(!upErr){
          const {data:pub} = sb.storage.from("fridge-activity-photos").getPublicUrl(path);
          photo_url = pub.publicUrl;
        } else {
          console.error("Photo upload failed:", upErr.message);
          photoFailed = true;
        }
      }
      const payload = {
        fridge_id: selectedFridge.id,
        activity_type: activityType,
        is_clean: isClean,
        is_working: isWorking,
        notes: notes || null,
        photo_url,
        volunteer_id: (session && !asGuest) ? session.user.id : null,
        guest_name: (!session || asGuest) ? (guestName || "Anonymous") : null,
      };
      const {data:inserted,error:insErr} = await sb.from("fridge_activity").insert(payload).select("id").single();
      if(insErr) throw insErr;
      if(activityType === "refill"){
        // fire-and-forget: don't block the success screen on email sending
        fetch("https://xbxagukdvgyaoqvbqoic.supabase.co/functions/v1/friend-portal", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({action:"notify_zone", fridge_id: selectedFridge.id, fridge_activity_id: inserted?.id})
        }).catch(()=>{});
      }
      setPhotoUploadFailed(photoFailed);
      setDone(true);
    }catch(e){
      setError(e.message || "Something went wrong — try again.");
    }
    setSubmitting(false);
  }

  if(done){
    const isGuestVisit = !session || asGuest;
    return (
      <div style={{minHeight:"100vh",background:CREAM,padding:"40px 24px"}}>
        <div style={{textAlign:"center",maxWidth:360,margin:"0 auto"}}>
          <img src={LOGO} style={{height:34,margin:"0 auto 18px",display:"block"}}/>
          <div style={{display:"flex",justifyContent:"center"}}><Sparkle size={48} color={DK}/></div>
          <div className="display" style={{fontSize:24,color:DK,marginTop:10}}>Thank you!</div>
          <div style={{fontFamily:BF,fontSize:14,color:MT,marginTop:8,lineHeight:1.6}}>
            Your {activityType} at {selectedFridge?.name_en} has been logged. Someone in Qatar eats a little easier tonight because of you.
          </div>
          {photoUploadFailed && (
            <div style={{marginTop:10,background:"#FEF3C7",color:"#B5591A",fontSize:12,fontFamily:BF,padding:"8px 12px",borderRadius:10}}>
              ⚠️ Your visit was logged, but the photo didn't upload — feel free to try again next time.
            </div>
          )}

          <div style={{marginTop:20,background:DK,borderRadius:16,padding:"16px 20px"}}>
            <div className="display" style={{fontSize:30,color:"#fff"}}>{counterTarget==null?"…":counterShown.toLocaleString()}</div>
            <div style={{fontFamily:BF,fontSize:11.5,color:"#BBF7D0",fontWeight:600,marginTop:2}}>total refills logged, together</div>
          </div>

          {isGuestVisit && (
            <div style={{marginTop:20,background:"#fff",border:"1px solid #E5DCC8",borderRadius:16,padding:18,textAlign:"left"}}>
              <div style={{fontFamily:BF,fontWeight:700,fontSize:14,color:DK,display:"flex",alignItems:"center",gap:6}}><Sparkle size={15} color={DK}/> Not registered yet?</div>
              <ul style={{fontFamily:BF,fontSize:12.5,color:MT,marginTop:8,paddingLeft:18,lineHeight:1.7}}>
                <li>See your personal refill count build up over time</li>
                <li>Mark fridges near you as "local" and get notified when someone nearby needs help</li>
                <li>Show up on the fairy leaderboard for your zone</li>
              </ul>
              <a href="index.html" style={{display:"block",textAlign:"center",marginTop:12,background:DK,color:"#fff",padding:"11px",borderRadius:12,fontWeight:700,fontFamily:BF,fontSize:13,textDecoration:"none"}}>Create a free account</a>
            </div>
          )}

          <a href="fridges.html" style={{display:"inline-block",marginTop:20,background:GR,color:"#fff",padding:"13px 28px",borderRadius:16,fontWeight:700,fontFamily:BF,fontSize:14,textDecoration:"none"}}>Back to fridges</a>
        </div>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:CREAM,paddingBottom:60}}>
      <div style={{maxWidth:520,margin:"0 auto",padding:"28px 20px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <img src={LOGO} style={{height:28}}/>
          <a href="fridges.html" style={{fontSize:12,color:DK,fontFamily:BF,fontWeight:600,textDecoration:"none",opacity:0.7}}>← Back</a>
        </div>

        <div className="display" style={{fontSize:26,color:DK,marginTop:22}}>Log your visit</div>
        <div style={{fontFamily:BF,fontSize:13.5,color:MT,marginTop:6,lineHeight:1.6}}>
          Refilled a fridge, gave it a clean, or spotted a problem? Tell us — it helps the whole network run.
        </div>

        {!session && (
          <div style={{marginTop:20,background:"#fff",border:"1px solid #F1E7D8",borderRadius:18,padding:16,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
            <div style={{fontFamily:BF,fontSize:12.5,color:MT}}>Sign in to build your fairy profile and track your refills — or continue as a guest below.</div>
            <a href="fairy-dashboard.html" style={{flexShrink:0,background:OR,color:"#fff",padding:"9px 16px",borderRadius:12,fontWeight:700,fontFamily:BF,fontSize:12.5,textDecoration:"none"}}>Sign in</a>
          </div>
        )}

        {session && profile && (
          <div style={{marginTop:20,background:GR_LT,borderRadius:18,padding:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontFamily:BF,fontSize:13,color:DK,display:"flex",alignItems:"center",gap:6}}><Sparkle size={13} color={DK}/> Logging as <b>{profile.username||profile.first_name||"you"}</b></div>
            <button onClick={()=>setAsGuest(!asGuest)} style={{background:"none",border:"none",color:MT,fontSize:12,fontFamily:BF,textDecoration:"underline",cursor:"pointer"}}>
              {asGuest ? "Log in with account instead" : "Log anonymously instead"}
            </button>
          </div>
        )}

        <div style={{marginTop:24}}>
          <label style={{fontFamily:BF,fontSize:12.5,fontWeight:700,color:DK}}>Which fridge?</label>
          <select value={fridgeCode} onChange={e=>setFridgeCode(e.target.value)} style={{
            width:"100%",marginTop:8,padding:"14px 16px",borderRadius:14,border:"1.5px solid #E5DCC8",
            fontSize:14,color:DK,background:"#fff"
          }}>
            <option value="">Select a fridge…</option>
            {fridges.map(f=><option key={f.id} value={f.code}>{f.name_en} ({f.code}) — {f.zone_name}</option>)}
          </select>
          {selectedFridge && (() => {
            const mapUrl = selectedFridge.map_link || (selectedFridge.lat && selectedFridge.lng ? `https://www.google.com/maps?q=${selectedFridge.lat},${selectedFridge.lng}` : null);
            return mapUrl ? (
              <a href={mapUrl} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginTop:8,background:"#F0FDF4",color:DK,border:`1.5px solid ${DK}`,borderRadius:12,padding:"10px",fontFamily:BF,fontWeight:700,fontSize:13,textDecoration:"none"}}>
                📍 Get directions to {selectedFridge.name_en}
              </a>
            ) : null;
          })()}
        </div>

        <div style={{marginTop:18}}>
          <label style={{fontFamily:BF,fontSize:12.5,fontWeight:700,color:DK}}>What did you do?</label>
          <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
            {[["refill",null],["cleaning","🧽 Cleaning"],["report_broken","⚠️ Report broken"],["report_moved","📍 Report moved"],["report_closed","🚫 Report closed"]].map(([k,label])=>(
              <button key={k} onClick={()=>setActivityType(k)} style={{
                display:"flex",alignItems:"center",gap:6,
                padding:"9px 14px",borderRadius:12,border: activityType===k?"none":"1.5px solid #E5DCC8",cursor:"pointer",
                fontFamily:BF,fontWeight:700,fontSize:12.5,
                background: activityType===k ? DK : "#fff", color: activityType===k ? "#fff" : DK,
              }}>
                {k==="refill" ? (
                  <>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 10Z" stroke={activityType===k?"#fff":DK} strokeWidth="2"/></svg>
                    Refill
                  </>
                ) : label}
              </button>
            ))}
          </div>
        </div>

        {(!session || asGuest) && (
          <div style={{marginTop:18}}>
            <label style={{fontFamily:BF,fontSize:12.5,fontWeight:700,color:DK}}>Your name (optional)</label>
            <input value={guestName} onChange={e=>setGuestName(e.target.value)} placeholder="Leave blank to log anonymously" style={{
              width:"100%",marginTop:8,padding:"14px 16px",borderRadius:14,border:"1.5px solid #E5DCC8",fontSize:14,color:DK
            }}/>
          </div>
        )}

        <div style={{marginTop:8}}>
          <Toggle label="Is the fridge clean?" value={isClean} onChange={setIsClean}/>
        </div>

        <div style={{marginTop:18}}>
          <label style={{fontFamily:BF,fontSize:12.5,fontWeight:700,color:DK}}>Add a photo (optional)</label>
          <label style={{
            display:"block",marginTop:8,border:`1.5px dashed ${DK}`,borderRadius:16,padding:"20px",
            textAlign:"center",cursor:"pointer",background:"#F0FDF4",color:DK,fontFamily:BF,fontSize:13,fontWeight:600
          }}>
            {photoFile ? `📷 ${photoFile.name}` : "📷 Tap to choose a photo"}
            <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>setPhotoFile(e.target.files[0])}/>
          </label>
        </div>

        <div style={{marginTop:18}}>
          <label style={{fontFamily:BF,fontSize:12.5,fontWeight:700,color:DK}}>Notes (optional)</label>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Anything else worth flagging?" rows={3} style={{
            width:"100%",marginTop:8,padding:"14px 16px",borderRadius:14,border:"1.5px solid #E5DCC8",fontSize:14,color:DK,resize:"vertical"
          }}/>
        </div>

        {error && <div style={{marginTop:14,color:"#DC2626",fontFamily:BF,fontSize:13}}>{error}</div>}

        <button onClick={handleSubmit} disabled={submitting} style={{
          width:"100%",marginTop:24,background:GR,color:"#fff",padding:"16px",borderRadius:16,
          border:"none",fontWeight:700,fontFamily:BF,fontSize:15,cursor:"pointer",opacity:submitting?0.7:1
        }}>{submitting?"Logging…":"Log this visit"}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
