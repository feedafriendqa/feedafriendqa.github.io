<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pearls of Purpose Guest List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: a working sheet. Summary strip on top, filter toolbar, then either an editable guest table or per-area driver run cards. */
:root{
  color-scheme:light;
  --bg:#F7F3EF; --surface:#FFFFFF; --fg:#2B1519; --muted:#745F62; --line:#E6DAD6; --field:#FBF8F5;
  --accent:#6E1426; --accent-fg:#FFFFFF; --accent-soft:#F4E7E5;
  --gold:#B39367; --hero-a:#4F0B19; --hero-b:#7A1A2E; --hero-fg:#FBF5EE;
  --ok:#2C7A4B; --ok-soft:#DDF0E4; --warn:#9A6212; --warn-soft:#F8EBCF; --crit:#A8364A; --crit-soft:#F7DFE3; --info:#2A5F9E; --info-soft:#DFEAF7; --idle:#745F62; --idle-soft:#EFE7E4;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif; --body:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150A0D; --surface:#221116; --fg:#F3E9E4; --muted:#B49FA0; --line:#3A2229; --field:#1A0D11;
  --accent:#E2C79F; --accent-fg:#2A0E15; --accent-soft:#3A1D26;
  --gold:#C9AE8A; --hero-a:#3E0813; --hero-b:#611425; --hero-fg:#FBF5EE;
  --ok:#6FCB94; --ok-soft:#1C3326; --warn:#E3B05B; --warn-soft:#3A2D14; --crit:#F08A9B; --crit-soft:#4A2029; --info:#82B4EC; --info-soft:#1B2D44; --idle:#B49FA0; --idle-soft:#2E1F24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150A0D; --surface:#221116; --fg:#F3E9E4; --muted:#B49FA0; --line:#3A2229; --field:#1A0D11;
  --accent:#E2C79F; --accent-fg:#2A0E15; --accent-soft:#3A1D26;
  --gold:#C9AE8A; --hero-a:#3E0813; --hero-b:#611425; --hero-fg:#FBF5EE;
  --ok:#6FCB94; --ok-soft:#1C3326; --warn:#E3B05B; --warn-soft:#3A2D14; --crit:#F08A9B; --crit-soft:#4A2029; --info:#82B4EC; --info-soft:#1B2D44; --idle:#B49FA0; --idle-soft:#2E1F24; color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h2{font-family:var(--display);font-size:26px;margin:0;font-weight:600}
.login p{margin:0;color:var(--muted)}
.login label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.login input{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.login .err{color:var(--crit);font-size:13px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{position:relative;text-align:center;color:var(--hero-fg);background:radial-gradient(120% 140% at 50% 0%,var(--hero-b),var(--hero-a) 70%);border:1px solid var(--gold);border-radius:28px 28px 60px 60px / 28px 28px 40px 40px;padding:28px 20px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;outline:1px solid color-mix(in srgb,var(--gold) 45%,transparent);outline-offset:-7px}
.logo{width:clamp(84px,14vw,120px);height:auto;display:block;margin-bottom:6px}
.eyebrow{margin:0;font-size:clamp(15px,2.6vw,20px);font-weight:500;letter-spacing:.34em;text-transform:uppercase}
.eyebrow.small{font-size:11px;letter-spacing:.3em;color:color-mix(in srgb,var(--hero-fg) 78%,transparent)}
h1{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(40px,9vw,84px);line-height:.98;margin:10px 0 0;text-wrap:balance}
h1 span{display:block;font-size:.62em;letter-spacing:.14em}
.rule{display:flex;align-items:center;gap:12px;width:min(340px,80%);margin:12px 0 4px}
.rule i{flex:1;height:1px;background:var(--gold)}
.rule b{width:10px;height:10px;border:1px solid var(--gold);transform:rotate(45deg)}
.tag{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;max-width:34ch;line-height:1.8}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px;margin:14px 0 0;padding:0}
.facts div{display:flex;flex-direction:column;align-items:center;gap:2px}
.facts dt{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.facts dd{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.pearl{width:18px;height:18px;border-radius:50%;margin-top:14px;background:radial-gradient(circle at 35% 30%,#fff,#EFDCCB 45%,#BFA587);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.head{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
h2.list{font-family:var(--display);font-weight:600;font-size:26px;margin:0}
.sub{color:var(--muted);margin:2px 0 0;max-width:62ch}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.live{background:var(--ok)}
.dot.err{background:var(--crit)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.stat.wide{grid-column:span 2}
@media (max-width:520px){.stat.wide{grid-column:1/-1}}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--idle-soft);margin:8px 0 6px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.toolbar input[type=search],.toolbar select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input[type=search]{flex:2 1 260px;max-width:none;font-size:15px;padding:10px 12px;border-color:var(--accent)}
.count{width:100%;font-size:12px;color:var(--muted)}
.spacer{flex:1 1 0}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px}
th{position:sticky;top:0;background:var(--accent-soft);color:var(--accent);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.idx{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;width:38px}
td.name,th.name{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
th.name{background:var(--accent-soft);z-index:2}
td input,td select,.card input,.card select{width:100%;font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 7px;min-width:0}
td input:hover,td select:hover,.card input:hover,.card select:hover{border-color:var(--line)}
td input:focus,td select:focus,.card input:focus,.card select:focus{background:var(--field);border-color:var(--accent);outline:none}
td input[type=number]{width:72px;text-align:center;font-variant-numeric:tabular-nums}
td.name input{font-weight:600;min-width:170px}
.glist{display:flex;flex-direction:column;gap:8px}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ghead{display:flex;align-items:center;gap:6px}
.ghead .no{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.grow{flex:1}
.lnk{border:0;background:transparent;color:var(--accent);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:6px}
.lnk:hover{background:var(--accent-soft)}
.gc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px;align-items:start}
.w2{grid-column:span 2}.w3{grid-column:span 3}
@media (max-width:420px){.w2,.w3{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f>span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.gc input,.gc select,.gc textarea{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.gc textarea{resize:none;overflow:hidden;display:block;line-height:1.35}
.gc input:focus,.gc select:focus,.gc textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.gc textarea[data-f="name"]{font-weight:700}
.gc input[type=number]{font-variant-numeric:tabular-nums}
select[data-v]{font-weight:600;border-radius:999px;padding-inline:10px}
select[data-v="Not sent"],select[data-v="Pending"],select[data-v="TBC"]{color:var(--idle);background:var(--idle-soft)}
select[data-v="Sent"],select[data-v="E-invite"]{color:var(--info);background:var(--info-soft)}
select[data-v="Delivered"],select[data-v="Attending"]{color:var(--ok);background:var(--ok-soft)}
select[data-v="Confirmed received"]{color:var(--accent-fg);background:var(--ok)}
select[data-v="Physical"]{color:var(--warn);background:var(--warn-soft)}
select[data-v="Declined"]{color:var(--crit);background:var(--crit-soft)}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;padding:6px 8px;border-radius:6px;white-space:nowrap}
.del:hover{color:var(--crit);background:var(--crit-soft)}
.del.sure{color:var(--crit);background:var(--crit-soft);font-weight:700}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.card header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.card h2{font-family:var(--display);font-size:20px;font-weight:600;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h2 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.prog{height:6px;border-radius:3px;background:var(--idle-soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.driver{display:flex;gap:6px}
.driver input{border:1px solid var(--line)!important;background:var(--field)!important}
.stop{padding:8px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.stop:last-child{border-bottom:0}
.stop .who{font-weight:600;min-width:0;overflow-wrap:anywhere}
.stop .meta{grid-column:1;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.stop select{width:auto}
.chip{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin-right:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.dot.live{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.45}}}

/* v3 list layout: grouped by area, one row per guest on wide screens, labelled cards on narrow ones */
.ar{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.ar h3{font-family:var(--display);font-size:22px;font-weight:600;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ar h3 small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.gr{display:grid;grid-template-columns:30px minmax(200px,1.5fr) minmax(130px,.8fr) minmax(190px,1.1fr) 104px 72px 150px 112px 84px;gap:8px;align-items:start}
.gh{padding:0 10px 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3;padding-top:4px}
.gc{padding:7px 10px}
.gc .no{padding-top:8px;text-align:center;font-size:12px;font-weight:700;color:var(--gold)}
.who{display:flex;flex-direction:column;gap:3px;min-width:0}
.gc textarea.nm,.gc textarea[data-f="name"]{font-weight:700}
.gc .sm input{font-size:12px;padding:4px 8px;color:var(--muted)}
.lab{display:none}
.acts{display:flex;flex-direction:column;align-items:stretch}
.acts .lnk,.acts .del{text-align:center;padding:3px 6px;font-size:12px}
.gd{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
@media (max-width:1240px){
  .gh{display:none}
  .gr{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .gr .no{text-align:left;padding:0;grid-column:1/-1}
  .who{grid-column:span 2}
  .lab{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .acts{flex-direction:row;justify-content:flex-end;grid-column:1/-1}
}
@media (max-width:420px){.who{grid-column:1/-1}}

/* driver board */
.lanes{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:10px;max-width:100%}
.lane{flex:0 0 min(310px,86vw);background:var(--idle-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lane h2{font-family:var(--display);font-size:24px;font-weight:600;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lane h2 small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.lane .hint{color:var(--muted)}
.lane .driver input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--fg);border-radius:6px;padding:7px 10px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tk .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tk .nm{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tk select{width:auto;flex:none;font:inherit;font-size:11.5px;font-weight:700;border:1px solid transparent;padding:3px 8px;cursor:pointer}
.tk .ln{font-size:12.5px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip2{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip2[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.hint2{color:var(--muted);margin:0 0 10px;font-size:13px}
.mc .lab{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mc .ghead strong{font-size:15px}
.mc .sm2{font-size:12px;color:var(--muted)}
.miss{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 10px}
.tk input{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.tabs{flex-wrap:wrap}

@media (min-width:1241px){.gl{grid-template-columns:minmax(220px,1.6fr) minmax(130px,.9fr) minmax(190px,1.2fr) 80px 150px 112px 84px}}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xbxagukdvgyaoqvbqoic.supabase.co';
const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhieGFndWtkdmd5YW9xdmJxb2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDExNDAsImV4cCI6MjA5NTYxNzE0MH0.-NifUdfkr9cZIDDtKNl5aQe9WMZab7l4boAJDAgfb-4';
const EVENT='pearls-of-purpose';
const sb=supabase.createClient(SUPABASE_URL,ANON_KEY);
const METHODS=["Physical","E-invite","TBC"], STATUSES=["Not sent","Sent","Delivered","Confirmed received"], RSVPS=["Pending","Attending","Declined"];
const STATUS_COLOR={"Not sent":"var(--idle)","Sent":"var(--info)","Delivered":"var(--ok)","Confirmed received":"var(--accent)"};
const open=new Set();
let missFilter="", canWrite=true, loaded=false, guests=new Map(), view="list", pendingDelete=null, focusNew=null;
const F={q:"",method:"",area:"",status:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val=(g,k)=>g[k]??"";

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function setSync(kind,text){$("#dot").className="dot "+kind;$("#syncText").textContent=text}

const nameKey=g=>String(g.name||"").trim().replace(/^(h\.?e\.?|sheikha|dr\.?|lady|mrs?\.?|ms\.?)\s+/i,"").toLowerCase()||"\uffff";
const cmpName=(a,b)=>nameKey(a).localeCompare(nameKey(b))||((a.order??1e9)-(b.order??1e9));
function sorted(){return [...guests].map(([id,g])=>({id,...g})).sort(cmpName)}
function filtered(){
  const q=F.q.trim().toLowerCase();
  return sorted().filter(g=>(!F.method||g.method===F.method)&&(!F.area||g.area===F.area)&&(!F.status||(g.status||"Not sent")===F.status)&&
    (!q||[g.name,g.org,g.notes,g.area,g.phone,g.email,g.address,g.driver].some(x=>String(x||"").toLowerCase().includes(q))));
}

function renderStats(){
  const all=sorted(), n=all.length;
  const total=all.reduce((s,g)=>s+(Number.isFinite(g.guests)?g.guests:0),0);
  const noCount=all.filter(g=>!Number.isFinite(g.guests)).length;
  const sc=s=>all.filter(g=>(g.status||"Not sent")===s).length;
  const segs=STATUSES.map(s=>({s,n:sc(s)}));
  $("#stats").innerHTML=`
    <div class="stat"><b>${n}</b><span>Invitations</span></div>
    <div class="stat"><b>${total}</b><span>Guests counted${noCount?` · ${noCount} without a number`:""}</span></div>
    <div class="stat wide"><b>${sc("Delivered")+sc("Confirmed received")} <span style="display:inline;font-family:var(--body);font-size:13px">of ${n} delivered or received</span></b>
      <div class="bar" role="img" aria-label="Invite status">${segs.map(x=>`<i style="width:${n?x.n/n*100:0}%;background:${STATUS_COLOR[x.s]}"></i>`).join("")}</div>
      <div class="legend">${segs.map(x=>`<em style="--c:${STATUS_COLOR[x.s]}">${x.s} ${x.n}</em>`).join("")}</div></div>`;
}

function syncLists(){
  const all=sorted();
  const areas=[...new Set(all.map(g=>g.area).filter(Boolean))];
  const drivers=[...new Set(all.map(g=>g.driver).filter(Boolean))];
  $("#areas").innerHTML=areas.map(a=>`<option value="${esc(a)}">`).join("");
  $("#drivers").innerHTML=drivers.map(a=>`<option value="${esc(a)}">`).join("");
  const sel=$("#fArea"), cur=F.area;
  sel.innerHTML=`<option value="">All areas</option>`+areas.map(a=>`<option${a===cur?" selected":""}>${esc(a)}</option>`).join("");
}

const dis=()=>canWrite?"":" disabled";
const txt=(g,f,list,ph)=>`<input data-f="${f}" value="${esc(val(g,f))}"${list?` list="${list}"`:""}${ph?` placeholder="${ph}"`:""}${dis()}>`;
const sel=(g,f,opts,def)=>{const v=g[f]||def;return `<select data-f="${f}" data-v="${esc(v)}"${dis()}>${opts.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select>`};

const RANK={"Not sent":0,"Sent":1,"Delivered":2,"Confirmed received":3};
function groupByArea(rows){
  const by=new Map();
  rows.forEach(g=>{const a=g.area||"No area yet";if(!by.has(a))by.set(a,[]);by.get(a).push(g)});
  by.forEach(list=>list.sort((a,b)=>(RANK[a.status||"Not sent"]-RANK[b.status||"Not sent"])||cmpName(a,b)));
  return by;
}
function renderList(){
  const rows=filtered().sort((a,b)=>(RANK[a.status||"Not sent"]-RANK[b.status||"Not sent"])||cmpName(a,b));
  if(!sorted().length) return `<div class="empty">No guests yet. Choose Add guest to enter the first one.</div>`;
  if(!rows.length) return `<div class="empty">No guests match these filters.</div>`;
  const ta=(g,f,label,cls="")=>`<label class="f ${cls}"><span class="lab">${label}</span><textarea rows="1" data-f="${f}" placeholder="${label}"${dis()}>${esc(val(g,f))}</textarea></label>`;
  const inp=(g,f,label,cls="",o={})=>`<label class="f ${cls}"><span class="lab">${label}</span><input data-f="${f}" type="${o.type||"text"}"${o.mode?` inputmode="${o.mode}"`:""}${o.list?` list="${o.list}"`:""} placeholder="${label}" value="${esc(val(g,f))}"${dis()}></label>`;
  const sl=(g,f,label,opts,def)=>`<label class="f"><span class="lab">${label}</span>${sel(g,f,opts,def)}</label>`;
  const head=`<div class="gr gl gh" aria-hidden="true"><span>Guest</span><span>Phone</span><span>Email</span><span>Guests</span><span>Invite status</span><span>RSVP</span><span></span></div>`;
  return head+`<div class="glist">${rows.map(g=>{
    const isOpen=open.has(g.id), filled=["area","day","sub","driver","address","notes"].filter(f=>g[f]).length;
    return `<article class="gc" data-id="${g.id}">
      <div class="gr gl">
        <div class="who">${ta(g,"name","Guest name","nm")}${inp(g,"org","Organisation / role","sm")}</div>
        ${inp(g,"phone","Phone","",{type:"tel",mode:"tel"})}
        ${inp(g,"email","Email","",{type:"email",mode:"email"})}
        <label class="f"><span class="lab">Guests</span><input data-f="guests" type="number" min="0" inputmode="numeric" placeholder="Guests" value="${Number.isFinite(g.guests)?g.guests:""}"${dis()}></label>
        ${sl(g,"status","Invite status",STATUSES,"Not sent")}${sl(g,"rsvp","RSVP",RSVPS,"Pending")}
        <div class="acts"><button class="lnk" data-more="${g.id}" aria-expanded="${isOpen}">${isOpen?"Hide":"More"}${filled&&!isOpen?` (${filled})`:""}</button>
          <button class="del${pendingDelete===g.id?" sure":""}" data-del="${g.id}"${dis()}>${pendingDelete===g.id?"Delete?":"Remove"}</button></div>
      </div>
      ${isOpen?`<div class="gd"><div class="grid">${sl(g,"method","Method",METHODS,"TBC")}${inp(g,"area","Area","w2",{list:"areas"})}${inp(g,"day","Day / handover","w2")}${inp(g,"sub","Group")}${inp(g,"driver","Driver","",{list:"drivers"})}${ta(g,"address","Address / map pin","w2")}${ta(g,"notes","Notes","w3")}</div></div>`:""}
    </article>`}).join("")}</div>`;
}

function renderRuns(){
  const rows=filtered();
  if(!rows.length) return `<div class="empty">${sorted().length?"No guests match these filters.":"No guests yet."}</div>`;
  const by=groupByArea(rows);
  return `<div class="lanes">${[...by].map(([area,list])=>{
    const done=list.filter(g=>["Delivered","Confirmed received"].includes(g.status)).length;
    const ds=[...new Set(list.map(g=>g.driver||""))], driver=ds.length===1?ds[0]:"";
    const digital=list.every(g=>g.method==="E-invite");
    return `<section class="lane" data-area="${esc(area)}">
      <h2>${esc(area)}<small>${list.length} guest${list.length>1?"s":""} · ${done} delivered</small></h2>
      <div class="prog" role="img" aria-label="${done} of ${list.length} delivered"><i style="width:${done/list.length*100}%"></i></div>
      ${digital?`<small class="hint">E-invites, no driver needed</small>`:`<div class="driver"><input data-rundriver placeholder="${ds.length>1?"Mixed drivers – set one for all":"Driver for this run"}" value="${esc(driver)}" list="drivers"${dis()} aria-label="Driver for ${esc(area)}"><button class="btn ghost" data-applydriver${dis()}>Set</button></div>`}
      ${list.map(g=>`<div class="tk" data-id="${g.id}">
        <div class="top"><div class="nm">${esc(g.name||"Unnamed")}${Number.isFinite(g.guests)?` · ${g.guests}`:""}</div>${sel(g,"status",STATUSES,"Not sent")}</div>
        <div class="ln">${[g.sub&&("Group "+g.sub),g.org,g.day,g.driver&&("Driver: "+g.driver)].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</div>
        <div class="ln">${[g.phone,g.email,g.address].filter(Boolean).map(esc).join(" · ")||"No phone or email yet"}</div>
      </div>`).join("")}
    </section>`}).join("")}</div>`;
}


function missingOf(g){
  const m=[];
  if(!(g.name||"").trim()||/name\(?s?\)? needed/i.test(g.notes||""))m.push("name");
  if(!g.phone&&!g.email)m.push("contact");
  if(!Number.isFinite(g.guests))m.push("count");
  if((g.method||"TBC")==="TBC")m.push("method");
  if(g.method==="Physical"&&!g.address)m.push("address");
  return m;
}
const MISS_LABEL={name:"Name",contact:"Phone or email",count:"Guest count",method:"Method",address:"Address"};
const ta2=(g,f,label,cls="")=>`<label class="f ${cls}"><span class="lab">${label}</span><textarea rows="1" data-f="${f}" placeholder="${label}"${dis()}>${esc(val(g,f))}</textarea></label>`;
const inp2=(g,f,label,cls="",o={})=>`<label class="f ${cls}"><span class="lab">${label}</span><input data-f="${f}" type="${o.type||"text"}"${o.mode?` inputmode="${o.mode}"`:""} placeholder="${label}" value="${esc(val(g,f))}"${dis()}></label>`;
function renderMissing(){
  if(!sorted().length)return `<div class="empty">No guests yet.</div>`;
  const base=filtered().map(g=>({g,m:missingOf(g)})).filter(x=>x.m.length);
  const counts={};Object.keys(MISS_LABEL).forEach(k=>counts[k]=base.filter(x=>x.m.includes(k)).length);
  const list=missFilter?base.filter(x=>x.m.includes(missFilter)):base;
  const chips=`<div class="chips"><button class="chip2" data-miss="" aria-pressed="${!missFilter}">All (${base.length})</button>${Object.keys(MISS_LABEL).map(k=>`<button class="chip2" data-miss="${k}" aria-pressed="${missFilter===k}">${MISS_LABEL[k]} (${counts[k]})</button>`).join("")}</div>`;
  if(!list.length)return chips+`<div class="empty">${filtered().length?"Nothing missing here. Every guest shown has what is needed.":"No guests match these filters."}</div>`;
  return chips+`<p class="hint2">Fill in the boxes and the guest drops off this list once their details are complete. Address is only asked for physical invitations.</p><div class="glist">${list.map(({g,m})=>`<article class="gc mc" data-id="${g.id}">
    <div class="ghead"><span class="no">#${esc(g.order??"")}</span><strong>${esc(g.name||"Unnamed guest")}</strong><span class="sm2">${[g.org,g.area].filter(Boolean).map(esc).join(" · ")}</span><span class="grow"></span><span class="miss">${m.map(k=>MISS_LABEL[k]).join(" · ")}</span></div>
    <div class="grid">
      ${m.includes("name")?ta2(g,"name","Guest name","w2"):""}
      ${m.includes("contact")?inp2(g,"phone","Phone","",{type:"tel",mode:"tel"})+inp2(g,"email","Email","w2",{type:"email",mode:"email"}):""}
      ${m.includes("count")?`<label class="f"><span class="lab">Number of guests</span><input data-f="guests" type="number" min="0" inputmode="numeric" placeholder="Guests" value=""${dis()}></label>`:""}
      ${m.includes("method")?`<label class="f"><span class="lab">Method</span>${sel(g,"method",METHODS,"TBC")}</label>`:""}
      ${m.includes("address")?ta2(g,"address","Address / map pin","w3"):""}
    </div></article>`).join("")}</div>`;
}
function renderRsvp(){
  const rows=filtered();
  if(!rows.length)return `<div class="empty">${sorted().length?"No guests match these filters.":"No guests yet."}</div>`;
  const notInvited=g=>(g.status||"Not sent")==="Not sent";
  const grp={"No reply yet":[],"Attending":[],"Declined":[],"Not invited yet":[]};
  rows.forEach(g=>{
    if(g.rsvp==="Attending")grp["Attending"].push(g);
    else if(g.rsvp==="Declined")grp["Declined"].push(g);
    else (notInvited(g)?grp["Not invited yet"]:grp["No reply yet"]).push(g);
  });
  grp["No reply yet"].sort((a,b)=>(RANK[b.status||"Not sent"]-RANK[a.status||"Not sent"])||cmpName(a,b));
  const head=sorted().reduce((s,g)=>s+((g.rsvp==="Attending"&&Number.isFinite(g.guests))?g.guests:0),0);
  const unk=grp["Attending"].filter(g=>!Number.isFinite(g.guests)).length;
  const tiles=`<div class="stats" style="margin-bottom:14px">
    <div class="stat"><b>${head}</b><span>Confirmed headcount${unk?` · ${unk} attending without a number`:""}</span></div>
    <div class="stat"><b>${grp["Attending"].length}</b><span>Attending</span></div>
    <div class="stat"><b>${grp["No reply yet"].length}</b><span>Invited, no reply yet</span></div>
    <div class="stat"><b>${grp["Declined"].length}</b><span>Declined</span></div>
    <div class="stat"><b>${grp["Not invited yet"].length}</b><span>Not invited yet</span></div></div>`;
  const card=g=>`<div class="tk" data-id="${g.id}">
    <div class="top"><div class="nm">${esc(g.name||"Unnamed")}</div>${sel(g,"rsvp",RSVPS,"Pending")}</div>
    <div class="ln">${[g.org,g.area].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</div>
    <div class="ln">${[g.phone,g.email].filter(Boolean).map(esc).join(" · ")||"No phone or email yet"}</div>
    <div class="ln">Invite: ${esc(g.status||"Not sent")}</div>
    <label class="f"><span class="lab" style="display:block">Number of guests</span><input data-f="guests" type="number" min="0" inputmode="numeric" placeholder="Guests" value="${Number.isFinite(g.guests)?g.guests:""}"${dis()}></label></div>`;
  const hints={"No reply yet":"Invitations sent or delivered. Delivered ones are first, so you can chase them first.","Not invited yet":"Invitation not sent yet. Set the invite status once it goes out and the guest moves to No reply yet."};
  return tiles+`<div class="lanes">${Object.keys(grp).map(k=>`<section class="lane"><h2>${k}<small>${grp[k].length} guest${grp[k].length===1?"":"s"}</small></h2>${hints[k]?`<small class="hint">${hints[k]}</small>`:""}${grp[k].map(card).join("")||`<small class="hint">None</small>`}</section>`).join("")}</div>`;
}

function render(){
  if(!loaded)return;
  const ae=document.activeElement, keep=ae&&ae.closest&&ae.dataset&&ae.dataset.f&&ae.closest("[data-id]")?{id:ae.closest("[data-id]").dataset.id,f:ae.dataset.f,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd}:null;
  const ctx=ae&&ae.hasAttribute&&ae.hasAttribute("data-rundriver")?{area:ae.closest("[data-area]").dataset.area,v:ae.value}:null;
  renderStats(); syncLists();
  const shown=filtered().length,all=guests.size;$("#count").textContent=(F.q||F.method||F.area||F.status)?`Showing ${shown} of ${all} guests`:`${all} guests`;
  const nMiss=sorted().filter(g=>missingOf(g).length).length;
  $("#tabMissing").textContent="Missing info"+(nMiss?` (${nMiss})`:"");
  $("#main").innerHTML=({list:renderList,runs:renderRuns,missing:renderMissing,rsvp:renderRsvp}[view]||renderList)();
  if(keep){const el=document.querySelector(`[data-id="${keep.id}"] [data-f="${keep.f}"]`);if(el){if(el.value!==keep.v&&el.tagName!=="SELECT")el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch{}}}
  if(ctx){const el=[...document.querySelectorAll("[data-area]")].find(c=>c.dataset.area===ctx.area)?.querySelector("[data-rundriver]");if(el){el.value=ctx.v;el.focus()}}
  autosizeAll();
  if(focusNew){const el=document.querySelector(`[data-id="${focusNew}"] [data-f="name"]`);if(el){el.focus();el.scrollIntoView({block:"center"});focusNew=null}}
}

function autosize(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}
function autosizeAll(){document.querySelectorAll(".gc textarea").forEach(autosize)}
window.addEventListener("resize",autosizeAll);
document.fonts?.ready?.then(autosizeAll);
document.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA")autosize(e.target)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="TEXTAREA"){e.preventDefault();e.target.blur()}});
function fromRow(r){return {order:r.sort_order,name:r.name,org:r.org,method:r.method,area:r.area,day:r.day,sub:r.sub,driver:r.driver,address:r.address,phone:r.phone,email:r.email,guests:r.guests,status:r.status,rsvp:r.rsvp,notes:r.notes}}
async function loadGuests(){
  const {data,error}=await sb.from("event_guests").select("*").eq("event",EVENT).order("sort_order");
  if(error){setSync("err","Connection lost");return}
  guests=new Map(data.map(r=>[r.id,fromRow(r)]));loaded=true;
  setSync("live","Live · edits save for everyone");render();
}
let reloadT;function scheduleReload(){clearTimeout(reloadT);reloadT=setTimeout(loadGuests,300)}
async function write(id,patch){
  const g=guests.get(id);if(g){guests.set(id,{...g,...patch});render()}
  const {error}=await sb.from("event_guests").update(patch).eq("id",id);
  if(error){toast("Could not save that change. Try again.");loadGuests()}
}
function parse(f,v,type){if(f==="guests")return v===""?null:Math.max(0,Math.round(Number(v)));return String(v).trim()}
async function commit(id,f,raw,type){
  const g=guests.get(id)||{}, nv=parse(f,raw,type), old=g[f]??(f==="guests"?null:"");
  if(nv===old||(old===""&&nv==="")||(f==="guests"&&nv===null&&(g.guests==null)))return;
  const patch={[f]:nv};
  if(f==="name"&&nv&&/name\(?s?\)? needed/i.test(g.notes||""))patch.notes=(g.notes||"").replace(/name\(?s?\)? needed\.?/i,"").trim();
  await write(id,patch);
}

document.addEventListener("change",e=>{
  const el=e.target, row=el.closest&&el.closest("[data-id]");
  if(row&&el.dataset.f)commit(row.dataset.id,el.dataset.f,el.value,el.type);
});
document.addEventListener("click",async e=>{
  const mc=e.target.closest("[data-miss]");
  if(mc){missFilter=mc.dataset.miss;render();return}
  const mo=e.target.closest("[data-more]");
  if(mo){const id=mo.dataset.more;open.has(id)?open.delete(id):open.add(id);render();return}
  const d=e.target.closest("[data-del]");
  if(d){const id=d.dataset.del;
    if(pendingDelete===id){pendingDelete=null;const {error}=await sb.from("event_guests").delete().eq("id",id);if(error)toast("Could not remove that guest.");else{guests.delete(id);render()}}
    else{pendingDelete=id;render();clearTimeout(click.t);click.t=setTimeout(()=>{pendingDelete=null;render()},3500)}
    return}
  const a=e.target.closest("[data-applydriver]");
  if(a){const card=a.closest("[data-area]"),area=card.dataset.area,v=card.querySelector("[data-rundriver]").value.trim();
    const ids=filtered().filter(g=>(g.area||"No area yet")===area).map(g=>g.id);
    for(const id of ids)await write(id,{driver:v});
    toast(v?`Driver set for ${ids.length} stop${ids.length>1?"s":""}.`:"Driver cleared.")}
});
const click={};
$("#add").addEventListener("click",async()=>{
  const order=Math.max(0,...sorted().map(g=>g.order||0))+1;
  F.q=F.method=F.area=F.status="";$("#q").value="";$("#fMethod").value="";$("#fStatus").value="";
  const {data,error}=await sb.from("event_guests").insert({event:EVENT,sort_order:order}).select().single();
  if(error)return toast("Could not add a guest.");
  guests.set(data.id,fromRow(data));focusNew=data.id;view="list";syncTabs();
});
function syncTabs(){[["list","#tabList"],["runs","#tabRuns"],["missing","#tabMissing"],["rsvp","#tabRsvp"]].forEach(([v,id])=>$(id).setAttribute("aria-pressed",view===v));render()}
$("#tabList").onclick=()=>{view="list";syncTabs()};
$("#tabRuns").onclick=()=>{view="runs";syncTabs()};
$("#tabMissing").onclick=()=>{view="missing";syncTabs()};
$("#tabRsvp").onclick=()=>{view="rsvp";syncTabs()};
$("#q").addEventListener("input",e=>{F.q=e.target.value;render()});
$("#fMethod").onchange=e=>{F.method=e.target.value;render()};
$("#fArea").onchange=e=>{F.area=e.target.value;render()};
$("#fStatus").onchange=e=>{F.status=e.target.value;render()};

let entered=false;
function showLogin(msg){
  entered=false;$("#app").hidden=true;$("#login").hidden=false;
  const e=$("#loginErr");e.hidden=!msg;e.textContent=msg||"";
  $("#loginBtn").disabled=false;$("#loginBtn").textContent="Sign in";
}
async function enter(session){
  if(!session)return showLogin();
  if(entered)return;
  const {data:role}=await sb.from("faf_user_roles").select("role").eq("email",session.user.email).maybeSingle();
  if(!role){await sb.auth.signOut();return showLogin("This account is not set up with staff access. Contact your administrator.")}
  entered=true;$("#login").hidden=true;$("#app").hidden=false;
  await loadGuests();
  sb.channel("event_guests_live").on("postgres_changes",{event:"*",schema:"public",table:"event_guests"},scheduleReload).subscribe();
}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("#loginBtn");b.disabled=true;b.textContent="Signing in…";
  const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});
  if(error)showLogin("That email or password did not work.");
});
$("#signout").addEventListener("click",()=>sb.auth.signOut());
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="SIGNED_OUT"){sb.removeAllChannels();guests=new Map();loaded=false;showLogin()}
  else if(session)setTimeout(()=>enter(session),0);
});
sb.auth.getSession().then(({data})=>enter(data.session));
</script>
</body>
</html>
