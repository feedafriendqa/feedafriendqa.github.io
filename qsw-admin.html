<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QSW Admin — Feed a Friend</title><link rel="icon" href="https://connect.feedafriend.org/faf-logo-email.png"/><meta name="robots" content="noindex"/>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:#F7FAF8;color:#0A3D1F}
h2,.sp,.c b{font-family:'League Spartan',sans-serif;font-weight:900}
.top{background:#0A3D1F;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:14px}.brand img{display:block}.brand .dv{width:1px;height:30px;background:#4B9A6C}
.brand .t{font-family:'League Spartan',sans-serif;font-weight:900;font-size:19px;margin-left:4px}
.top a{color:#fff;cursor:pointer;text-decoration:underline;font-size:12.5px;margin-left:16px;opacity:.9}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px 40px}
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A3D1F;padding:20px}
.login{background:#fff;border-radius:16px;padding:32px 30px;width:380px;max-width:94vw}
.login .lg{display:flex;align-items:center;gap:12px;background:#056839;border-radius:10px;padding:14px 16px;margin-bottom:20px}
.login label{font-size:12px;font-weight:700}
input,select{width:100%;padding:10px 12px;border:1.5px solid #BBF7D0;border-radius:8px;margin:6px 0 14px;font-size:14px;font-family:inherit;color:#0A3D1F;background:#fff}
button{font-family:inherit;background:#0A3D1F;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:13px}
button.alt{background:#fff;color:#0A3D1F;border:1.5px solid #BBF7D0}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.c{background:#fff;border-radius:12px;padding:16px 18px;flex:1 1 140px;min-width:140px;border:1px solid #BBF7D0}
.c b{display:block;font-size:30px;line-height:1;color:#0A3D1F}.c span{display:block;font-size:11px;color:#4B7C5A;letter-spacing:.06em;font-weight:600;margin-top:8px;order:2}
.tw{overflow-x:auto;border-radius:10px;border:1px solid #DCFCE7;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;vertical-align:top}tbody tr:nth-child(odd){background:#F7FDF9}
th{background:#0A3D1F;color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
.p{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}.y{background:#DCFCE7;color:#166534}.n{background:#FEE2E2;color:#991B1B}.w{background:#F3F4F6;color:#4B5563}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row select{width:auto;min-width:280px;margin:0}.err{color:#B91C1C;font-size:13px;margin:0 0 12px}
</style></head><body><div id="app"></div>
<script>
const sb=supabase.createClient("https://xbxagukdvgyaoqvbqoic.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhieGFndWtkdmd5YW9xdmJxb2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDExNDAsImV4cCI6MjA5NTYxNzE0MH0.-NifUdfkr9cZIDDtKNl5aQe9WMZab7l4boAJDAgfb-4",{auth:{storage:window.sessionStorage,storageKey:"qsw-admin-auth"}});
const app=document.getElementById("app");let rows=[],sel="",teams=[],lb={},legacy=[];
const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function login(msg){app.innerHTML=`<div class="login-bg"><div class="login"><div class="lg"><img src="https://connect.feedafriend.org/faf-logo-white-email.png" alt="Feed a Friend" height="34"/><img src="https://connect.feedafriend.org/qsw-logo-white-email.png" alt="Qatar Sustainability Week 2026" height="34"/></div><h2 style="font-size:24px;margin-bottom:4px">QSW Admin</h2><p style="font-size:13px;color:#4B7C5A;margin-bottom:20px">Sign in with your Feed a Friend admin account.</p><label>Email</label><input id="e" type="email"/><label>Password</label><input id="p" type="password"/><div class="err">${E(msg||"")}</div><button id="go" style="width:100%;padding:12px;font-size:14px">Sign in</button></div></div>`;
 const go=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:e.value,password:p.value});if(error)return login(error.message);await boot();};go.call;document.getElementById("go").onclick=go;p.onkeydown=ev=>ev.key==="Enter"&&go();}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return login();
 const {data:pr}=await sb.from("profiles").select("role,first_name").eq("id",session.user.id).maybeSingle();
 if(!pr||!["admin","superadmin"].includes(pr.role)){await sb.auth.signOut();return login("This account isn't an admin.");}
 await load();}
async function load(){const {data,error}=await sb.from("qsw_signups").select("*").order("event_date").order("created_at");if(error){app.innerHTML="<div class='wrap'>"+E(error.message)+"</div>";return;}const isRace=r=>/refill race|refill-race/i.test((r.event_title||"")+" "+(r.session_key||""));legacy=data.filter(isRace);rows=data.filter(r=>!isRace(r));
 const t=await sb.from("fridge_teams").select("id,name,business,captain_name,captain_email,member_count,is_student_team,school_name,briefing_rsvp,briefing_rsvp_note,created_at").order("created_at");teams=t.data||[];
 const l=await sb.from("fridge_leaderboard").select("team_id,logs_count,points");lb={};(l.data||[]).forEach(x=>lb[x.team_id]=x);
 if(!sel)sel="__race";draw();}
function drawRace(keys){const known=new Set(teams.map(t=>String(t.captain_email||"").toLowerCase()));const pend=legacy.filter(r=>!known.has(String(r.email||"").toLowerCase()));const att=teams.filter(t=>t.briefing_rsvp==="yes"),dec=teams.filter(t=>t.briefing_rsvp==="no"),none=teams.filter(t=>!t.briefing_rsvp);const sum=a=>a.reduce((n,t)=>n+(t.member_count||0),0);const refills=teams.reduce((n,t)=>n+((lb[t.id]||{}).logs_count||0),0);
 app.innerHTML=`<div class="top"><div class="brand"><img src="https://connect.feedafriend.org/faf-logo-white-email.png" alt="Feed a Friend" height="34"/><div class="dv"></div><img src="https://connect.feedafriend.org/qsw-logo-white-email.png" alt="Qatar Sustainability Week 2026" height="34"/><span class="t">QSW Admin</span></div><span><a href="fridge-admin.html">Fridge Admin</a><a id="out">Sign out</a></span></div><div class="wrap"><div class="row"><select id="s">${keys.map(([k,l])=>`<option value="${E(k)}" ${k===sel?"selected":""}>${E(l)}</option>`).join("")}</select><button class="alt" id="rf">Refresh</button></div>
 <div class="cards"><div class="c"><span>TEAMS</span><b>${teams.length}</b></div>${pend.length?`<div class="c"><span>SIGNED UP, NOT A TEAM YET</span><b>${pend.length}</b></div>`:""}<div class="c"><span>PEOPLE</span><b>${sum(teams)}</b></div><div class="c"><span>BRIEFING: ATTENDING</span><b>${att.length}</b></div><div class="c"><span>CAN'T ATTEND</span><b>${dec.length}</b></div><div class="c"><span>NO ANSWER</span><b>${none.length}</b></div><div class="c"><span>REFILLS LOGGED</span><b>${refills}</b></div></div>
 <div class="tw"><table><tr><th>TEAM</th><th>CAPTAIN</th><th>MEMBERS</th><th>BRIEFING RSVP (9:15am Sun)</th><th>NOTE</th><th>REFILLS</th><th>POINTS</th></tr>${teams.map(t=>`<tr><td><b>${E(t.name)}</b><br>${E(t.business||t.school_name||"")}${t.is_student_team?' <span class="p w">STUDENT</span>':""}</td><td>${E(t.captain_name)}<br>${E(t.captain_email)}</td><td>${t.member_count||0}</td><td>${t.briefing_rsvp==="yes"?'<span class="p y">Attending</span>':t.briefing_rsvp==="no"?'<span class="p n">Can\'t attend</span>':'<span class="p w">No answer</span>'}</td><td>${E(t.briefing_rsvp_note)}</td><td>${(lb[t.id]||{}).logs_count||0}</td><td>${(lb[t.id]||{}).points||0}</td></tr>`).join("")}${pend.map(r=>`<tr style="background:#FFFBEB"><td><b>${E(r.company||r.full_name)}</b><br><span class="p w">SIGNED UP ON QSW PAGE · NOT YET A TEAM</span></td><td>${E(r.full_name)}<br>${E(r.email)}<br>${E(r.phone)}</td><td>${r.people_count||0}</td><td><span class="p w">No answer</span></td><td></td><td>0</td><td>0</td></tr>`).join("")}</table></div></div>`;
 s.onchange=()=>{sel=s.value;draw();};rf.onclick=load;out.onclick=async()=>{await sb.auth.signOut();login();};}
function draw(){const keys=[["__race","Fridge Refill Race · all "+teams.length+" teams"]].concat([...new Map(rows.map(r=>[r.session_key,r.event_title+" · "+r.event_date])).entries()]);if(sel==="__race")return drawRace(keys);
 const cur=rows.filter(r=>r.session_key===sel);const conf=cur.filter(r=>!r.is_waitlist);
 const sum=a=>a.reduce((n,r)=>n+(r.people_count||0),0);
 const att=conf.filter(r=>r.rsvp==="yes"),dec=conf.filter(r=>r.rsvp==="no"),none=conf.filter(r=>!r.rsvp),came=conf.filter(r=>r.attended===true);
 app.innerHTML=`<div class="top"><div class="brand"><img src="https://connect.feedafriend.org/faf-logo-white-email.png" alt="Feed a Friend" height="34"/><div class="dv"></div><img src="https://connect.feedafriend.org/qsw-logo-white-email.png" alt="Qatar Sustainability Week 2026" height="34"/><span class="t">QSW Admin</span></div><span><a id="fr" href="fridge-admin.html">Fridge Admin</a><a id="out">Sign out</a></span></div><div class="wrap">
 <div class="row"><select id="s">${keys.map(([k,l])=>`<option value="${E(k)}" ${k===sel?"selected":""}>${E(l)}</option>`).join("")}</select><button id="csv">Download CSV</button><button class="alt" id="rf">Refresh</button></div>
 <div class="cards"><div class="c"><span>CONFIRMED PEOPLE</span><b>${sum(conf)}</b></div><div class="c"><span>ATTENDING (RSVP)</span><b>${sum(att)}</b></div><div class="c"><span>CAN'T ATTEND</span><b>${sum(dec)}</b></div><div class="c"><span>NO ANSWER</span><b>${sum(none)}</b></div><div class="c"><span>CAME (CHECKED IN)</span><b>${sum(came)}</b></div><div class="c"><span>WAITLIST</span><b>${sum(cur.filter(r=>r.is_waitlist))}</b></div></div>
 <div class="tw"><table><tr><th>CONTACT</th><th>GROUP</th><th>PEOPLE</th><th>PHONE</th><th>RSVP</th><th>NOTE</th><th>CAME?</th></tr>
 ${cur.map(r=>`<tr><td><b>${E(r.full_name)}</b><br>${E(r.email)}</td><td>${E(r.company)}${r.is_waitlist?' <span class="p w">WAITLIST</span>':""}</td><td>${r.people_count}</td><td>${E(r.phone)}</td><td>${r.rsvp==="yes"?'<span class="p y">Attending</span>':r.rsvp==="no"?'<span class="p n">Can\'t attend</span>':'<span class="p w">No answer</span>'}</td><td>${E(r.rsvp_note)}</td><td><select data-id="${r.id}" style="width:auto;margin:0;padding:6px"><option value="">–</option><option value="t" ${r.attended===true?"selected":""}>Came</option><option value="f" ${r.attended===false?"selected":""}>Didn't come</option></select></td></tr>`).join("")}</table></div></div>`;
 s.onchange=()=>{sel=s.value;draw();};rf.onclick=load;out.onclick=async()=>{await sb.auth.signOut();login();};
 csv.onclick=()=>{const h=["session","name","email","company","people","phone","waitlist","rsvp","note","attended"];const L=[h.join(",")].concat(cur.map(r=>[r.event_title,r.full_name,r.email,r.company,r.people_count,r.phone,r.is_waitlist,r.rsvp||"",r.rsvp_note||"",r.attended==null?"":r.attended].map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\n")],{type:"text/csv"}));a.download="qsw-"+sel+".csv";a.click();};
 document.querySelectorAll("select[data-id]").forEach(x=>x.onchange=async()=>{const v=x.value===""?null:x.value==="t";const {error}=await sb.from("qsw_signups").update({attended:v}).eq("id",x.dataset.id);if(error)alert(error.message);else{rows.find(r=>r.id===x.dataset.id).attended=v;draw();}});}
boot();
</script></body></html>
